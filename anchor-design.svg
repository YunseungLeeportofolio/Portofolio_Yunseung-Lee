<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="분석 설계: 청년 통계(Big-데이터웨이브·KOSIS) 수집, 상관분석, 청년 6·외국인 청년 4개 부문 지표 정리. 기사 22,292건(부산일보·국제신문, 5년)을 BERTopic, 감성·시계열 분석. 같은 의제 기준으로 현실과 보도를 대조하고, 간극을 설문 약 500명·인터뷰 40여 명 문항으로 연결."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="520" rx="26" fill="#0E1726"/><rect width="1200" height="520" rx="26" fill="url(#g)"/><defs><marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2AC1BC"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7A6B"/></marker><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F5B841"/></marker><marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA8FF"/></marker><marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B82"/></marker><marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">ANALYSIS DESIGN</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">통계와 기사를 따로 분석한 뒤, 같은 의제 기준으로 맞대었습니다</text><rect x="48" y="130" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="68.0" y="160.0" font-size="11" fill="#2AC1BC" font-weight="700" letter-spacing="1.5">01  COLLECT</text><text class="kr" x="68.0" y="192.0" font-size="18" fill="#F8FAFC" font-weight="800">청년 통계 수집</text><text class="kr" x="68.0" y="218.0" font-size="13.5" fill="#E2E8F0">Big-데이터웨이브 · KOSIS</text><line x1="274.0" y1="192.0" x2="292.0" y2="192.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="296" y="130" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="316.0" y="160.0" font-size="11" fill="#2AC1BC" font-weight="700" letter-spacing="1.5">02  CORRELATE</text><text class="kr" x="316.0" y="192.0" font-size="18" fill="#F8FAFC" font-weight="800">상관분석</text><text class="kr" x="316.0" y="218.0" font-size="13.5" fill="#E2E8F0">변인 간 연관성 확인</text><line x1="522.0" y1="192.0" x2="540.0" y2="192.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="544" y="130" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="564.0" y="160.0" font-size="11" fill="#2AC1BC" font-weight="700" letter-spacing="1.5">03  INDICATOR</text><text class="kr" x="564.0" y="192.0" font-size="18" fill="#F8FAFC" font-weight="800">실태 지표 정리</text><text class="kr" x="564.0" y="218.0" font-size="13.5" fill="#E2E8F0">청년 6 · 외국인 청년 4개 부문</text><line x1="770.0" y1="192.0" x2="850.0" y2="192.0" stroke="#2AC1BC" stroke-width="2.4" marker-end="url(#hm)"/><rect x="48" y="290" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="68.0" y="320.0" font-size="11" fill="#F5B841" font-weight="700" letter-spacing="1.5">01  COLLECT</text><text class="kr" x="68.0" y="352.0" font-size="18" fill="#F8FAFC" font-weight="800">기사 22,292건</text><text class="kr" x="68.0" y="378.0" font-size="13.5" fill="#E2E8F0">부산일보 · 국제신문 · 5년</text><line x1="274.0" y1="352.0" x2="292.0" y2="352.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="296" y="290" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="316.0" y="320.0" font-size="11" fill="#F5B841" font-weight="700" letter-spacing="1.5">02  TOPIC</text><text class="kr" x="316.0" y="352.0" font-size="18" fill="#F8FAFC" font-weight="800">BERTopic</text><text class="kr" x="316.0" y="378.0" font-size="13.5" fill="#E2E8F0">청년 · 유학생 의제 분류</text><line x1="522.0" y1="352.0" x2="540.0" y2="352.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="544" y="290" width="222" height="124" rx="14" fill="#142034"/><text class="mono" x="564.0" y="320.0" font-size="11" fill="#F5B841" font-weight="700" letter-spacing="1.5">03  TONE</text><text class="kr" x="564.0" y="352.0" font-size="18" fill="#F8FAFC" font-weight="800">감성 · 시계열</text><text class="kr" x="564.0" y="378.0" font-size="13.5" fill="#E2E8F0">의제별 논조와 시기 변화</text><line x1="770.0" y1="352.0" x2="850.0" y2="352.0" stroke="#F5B841" stroke-width="2.4" marker-end="url(#ha)"/><rect x="856" y="130" width="296" height="284" rx="16" fill="#142034" stroke="#FF7A6B" stroke-opacity=".7" stroke-width="1.5"/><text class="mono" x="880.0" y="166.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">04  COMPARE</text><text class="kr" x="880.0" y="202.0" font-size="20" fill="#F8FAFC" font-weight="800">현실과 보도의 간극</text><text class="kr" x="880.0" y="238.0" font-size="15" fill="#E2E8F0">같은 의제(일자리 · 유출 · 주거 ·</text><text class="kr" x="880.0" y="264.0" font-size="15" fill="#E2E8F0">건강 · 유학생)를 기준으로</text><text class="kr" x="880.0" y="290.0" font-size="15" fill="#E2E8F0">통계가 보여 준 현실과</text><text class="kr" x="880.0" y="316.0" font-size="15" fill="#E2E8F0">보도 비중 · 논조를 대조</text><text class="kr" x="880.0" y="366.0" font-size="13" fill="#94A3B8">연령대 세분화</text><text class="kr" x="880.0" y="388.0" font-size="13" fill="#94A3B8">만 18–39세 → 생애 단계별</text><rect x="48" y="448" width="1104" height="44" rx="12" fill="#FF7A6B" fill-opacity=".12"/><text class="mono" x="70.0" y="476.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">NEXT</text><text class="kr" x="124.0" y="476.0" font-size="15.5" fill="#F8FAFC" font-weight="600">찾은 간극을 설문(약 500명) · 인터뷰(40여 명) 문항으로 바꿔 당사자의 목소리로 다시 검증</text></svg>