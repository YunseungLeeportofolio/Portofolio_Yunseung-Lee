<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="통계와 보도의 간극. 고용·창업: 이사 이유 1위 더 나은 일자리 51.5%, 보도는 지원 행사 중심 긍정 논조로 가장 많이 다룸. 인구 유출: 8년간 청년 인구 18.3% 감소, 보도 비중 3–4%. 주거: 부모와 동거 57.7%, 보도 비중 3–4%·주거 형태 의제 없음. 정신건강: 우울증상 3.3%→7.9%, 보도 연 최대 3건. 유학생: 고용 경험 기업 5.5%, 언론은 지방대 소멸의 대안으로만."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="700" rx="26" fill="#0E1726"/><rect width="1200" height="700" rx="26" fill="url(#g)"/><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">FINDING 2 · INTEGRATE</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">통계 속 청년과 보도 속 청년은 다른 문제를 겪고 있었습니다</text><text class="kr" x="48.0" y="128.0" font-size="13" fill="#5B6B82">의제</text><text class="kr" x="250.0" y="128.0" font-size="13" fill="#2AC1BC" font-weight="700">통계가 보여 준 현실</text><text class="kr" x="690.0" y="128.0" font-size="13" fill="#F5B841" font-weight="700">언론이 다룬 방식</text><rect x="36" y="150" width="1128" height="88" rx="14" fill="#16283A"/><text class="kr" x="54.0" y="202.0" font-size="18" fill="#F8FAFC" font-weight="800">고용 · 창업</text><text class="en" x="250.0" y="190.0" font-size="26" fill="#F8FAFC" font-weight="800">51.5%</text><text class="kr" x="250.0" y="218.0" font-size="14" fill="#94A3B8">이사 이유 1위 ‘더 나은 일자리’</text><text class="kr" x="690.0" y="188.0" font-size="15.5" fill="#E2E8F0">지역 산업 · 엑스포와 연계한 지원 행사 중심</text><text class="kr" x="690.0" y="216.0" font-size="15" fill="#2AC1BC" font-weight="700">긍정 논조 우세 · 비중 있게 보도</text><rect x="36" y="248" width="1128" height="88" rx="14" fill="#142034"/><text class="kr" x="54.0" y="300.0" font-size="18" fill="#F8FAFC" font-weight="800">인구 유출</text><text class="en" x="250.0" y="288.0" font-size="26" fill="#F8FAFC" font-weight="800">−18.3%</text><text class="kr" x="250.0" y="316.0" font-size="14" fill="#94A3B8">8년간 청년 인구 감소</text><text class="kr" x="690.0" y="286.0" font-size="15.5" fill="#E2E8F0">노인 · 고령화 · 출산 · 소멸의 틀 안에서만</text><text class="kr" x="690.0" y="314.0" font-size="15" fill="#FF7A6B" font-weight="700">보도 비중 3–4%</text><rect x="36" y="346" width="1128" height="88" rx="14" fill="#142034"/><text class="kr" x="54.0" y="398.0" font-size="18" fill="#F8FAFC" font-weight="800">주거</text><text class="en" x="250.0" y="386.0" font-size="26" fill="#F8FAFC" font-weight="800">57.7%</text><text class="kr" x="250.0" y="414.0" font-size="14" fill="#94A3B8">부모와 함께 사는 청년 (2024)</text><text class="kr" x="690.0" y="384.0" font-size="15.5" fill="#E2E8F0">대출 · 금융 · 임금 등 경제 문제의 부속물</text><text class="kr" x="690.0" y="412.0" font-size="15" fill="#FF7A6B" font-weight="700">보도 비중 3–4% · 주거 형태는 의제 없음</text><rect x="36" y="444" width="1128" height="88" rx="14" fill="#142034"/><text class="kr" x="54.0" y="496.0" font-size="18" fill="#F8FAFC" font-weight="800">정신건강</text><text class="en" x="250.0" y="484.0" font-size="26" fill="#F8FAFC" font-weight="800">3.3% → 7.9%</text><text class="kr" x="250.0" y="512.0" font-size="14" fill="#94A3B8">우울증상 유병률 (2022 → 2024)</text><text class="kr" x="690.0" y="482.0" font-size="15.5" fill="#E2E8F0">청년 건강 · 저출산 보도</text><text class="kr" x="690.0" y="510.0" font-size="15" fill="#FF7A6B" font-weight="700">한 해 최대 3건</text><rect x="36" y="542" width="1128" height="88" rx="14" fill="#142034"/><text class="kr" x="54.0" y="594.0" font-size="18" fill="#F8FAFC" font-weight="800">외국인 유학생</text><text class="en" x="250.0" y="582.0" font-size="26" fill="#F8FAFC" font-weight="800">5.5%</text><text class="kr" x="250.0" y="610.0" font-size="14" fill="#94A3B8">유학생 고용 경험이 있는 부울경 기업</text><text class="kr" x="690.0" y="580.0" font-size="15.5" fill="#E2E8F0">지방대 소멸을 막을 대안으로만</text><text class="kr" x="690.0" y="608.0" font-size="15" fill="#FF7A6B" font-weight="700">유학생을 ‘수단’으로 보는 시선</text><text class="kr" x="48.0" y="668.0" font-size="14" fill="#94A3B8">통계: Big-데이터웨이브 · KOSIS 등 · 보도: 부산일보 · 국제신문 청년 · 유학생 기사 22,292건 (5년)</text></svg>