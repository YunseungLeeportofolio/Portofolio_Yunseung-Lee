<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="YTN 보도에서 대통령 거부권 68건, 간호사 응원·감사 4건. 긍정 감성 점수는 대한간호협회 유튜브 댓글 0.7, 온라인 커뮤니티 0.3. 진단: 법에 대한 반감이 아니라 쟁점의 정치화와 오해."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="460" rx="26" fill="#0E1726"/><rect width="1200" height="460" rx="26" fill="url(#g)"/><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">RESULT</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">보도의 중심은 간호사에서 정치 갈등으로 옮겨 갔습니다</text><rect x="36" y="112" width="552" height="270" rx="18" fill="#142034"/><text class="kr" x="64.0" y="150.0" font-size="13.5" fill="#94A3B8">YTN 의제별 보도 건수</text><text class="kr" x="64.0" y="204.0" font-size="16" fill="#F8FAFC" font-weight="700">대통령 거부권</text><rect x="64" y="218" width="380.0" height="30" rx="6" fill="#FF7A6B" fill-opacity=".85"/><text class="en" x="456.0" y="241.0" font-size="20" fill="#FF7A6B" font-weight="800">68건</text><text class="kr" x="64.0" y="288.0" font-size="16" fill="#F8FAFC" font-weight="700">간호사 응원 · 감사</text><rect x="64" y="302" width="22.4" height="30" rx="6" fill="#2AC1BC" fill-opacity=".85"/><text class="en" x="98.4" y="325.0" font-size="20" fill="#2AC1BC" font-weight="800">4건</text><rect x="612" y="112" width="552" height="270" rx="18" fill="#142034"/><text class="kr" x="640.0" y="150.0" font-size="13.5" fill="#94A3B8">긍정 감성 점수 (0–1, 1에 가까울수록 긍정)</text><text class="kr" x="640.0" y="204.0" font-size="16" fill="#F8FAFC" font-weight="700">대한간호협회 유튜브 댓글</text><rect x="640" y="218" width="294.0" height="30" rx="6" fill="#8FA8FF" fill-opacity=".85"/><text class="en" x="946.0" y="241.0" font-size="20" fill="#8FA8FF" font-weight="800">0.7</text><text class="kr" x="640.0" y="288.0" font-size="16" fill="#F8FAFC" font-weight="700">온라인 커뮤니티 4곳</text><rect x="640" y="302" width="126.0" height="30" rx="6" fill="#FF7A6B" fill-opacity=".85"/><text class="en" x="778.0" y="325.0" font-size="20" fill="#FF7A6B" font-weight="800">0.3</text><text class="kr" x="48.0" y="416.0" font-size="15" fill="#E2E8F0" font-weight="600">진단: 법에 대한 반감이 아니라 쟁점의 정치화와 오해. ‘지역사회’ 문구 논란 같은 쟁점이 사실 확인 없이</text><text class="kr" x="48.0" y="440.0" font-size="15" fill="#E2E8F0" font-weight="600">조롱 · 비난과 함께 커뮤니티에서 확산되고 있었습니다.</text></svg>