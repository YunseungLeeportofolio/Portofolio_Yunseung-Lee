<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="분석 흐름: 1 빅카인즈 2021.01–2023.05 보도량을 월별·언론사별·성향별로 비교해 YTN이 두드러짐. 2 YTN 기사·방송 스크립트 605건을 11개 의제로 분류, 보도 중심이 정치 갈등으로 이동. 3 디시인사이드 등 커뮤니티 4곳 딥러닝 감성·비시민성 분석, 부정 감성은 법보다 정치 쟁점을 겨냥. 4 협회 유튜브 영상 31개·댓글 4,336개는 비교 자료, 긍정 감성 0.7 대 커뮤니티 0.3."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="560" rx="26" fill="#0E1726"/><rect width="1200" height="560" rx="26" fill="url(#g)"/><defs><marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2AC1BC"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7A6B"/></marker><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F5B841"/></marker><marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA8FF"/></marker><marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B82"/></marker><marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">ANALYSIS FLOW</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">한 번에 설계하지 않고, 앞 단계의 결과가 다음 질문과 데이터를 정했습니다</text><rect x="48" y="120" width="258" height="190" rx="16" fill="#142034"/><text class="mono" x="70.0" y="154.0" font-size="11" fill="#E2E8F0" font-weight="700" letter-spacing="1.5">STEP 01</text><text class="kr" x="70.0" y="190.0" font-size="20" fill="#F8FAFC" font-weight="800">보도량</text><text class="mono" x="70.0" y="224.0" font-size="10.5" fill="#5B6B82" letter-spacing="1.5">DATA</text><text class="kr" x="70.0" y="250.0" font-size="14" fill="#E2E8F0">빅카인즈 2021.01–2023.05</text><text class="kr" x="70.0" y="274.0" font-size="14" fill="#E2E8F0">월별 · 언론사별 · 성향별</text><rect x="48" y="334" width="258" height="96" rx="14" fill="#94A3B8" fill-opacity=".13"/><text class="mono" x="70.0" y="364.0" font-size="10.5" fill="#E2E8F0" font-weight="700" letter-spacing="1.5">FINDING</text><text class="kr" x="70.0" y="390.0" font-size="15" fill="#F8FAFC" font-weight="700">YTN의 보도량이</text><text class="kr" x="70.0" y="414.0" font-size="15" fill="#F8FAFC" font-weight="700">유독 두드러짐</text><line x1="309.0" y1="215.0" x2="325.0" y2="215.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="328" y="120" width="258" height="190" rx="16" fill="#142034"/><text class="mono" x="350.0" y="154.0" font-size="11" fill="#F5B841" font-weight="700" letter-spacing="1.5">STEP 02</text><text class="kr" x="350.0" y="190.0" font-size="20" fill="#F8FAFC" font-weight="800">YTN 의제</text><text class="mono" x="350.0" y="224.0" font-size="10.5" fill="#5B6B82" letter-spacing="1.5">DATA</text><text class="kr" x="350.0" y="250.0" font-size="14" fill="#E2E8F0">기사 · 방송 스크립트 605건</text><text class="kr" x="350.0" y="274.0" font-size="14" fill="#E2E8F0">11개 의제 · 시계열 · 연결망</text><rect x="328" y="334" width="258" height="96" rx="14" fill="#F5B841" fill-opacity=".13"/><text class="mono" x="350.0" y="364.0" font-size="10.5" fill="#F5B841" font-weight="700" letter-spacing="1.5">FINDING</text><text class="kr" x="350.0" y="390.0" font-size="15" fill="#F8FAFC" font-weight="700">보도의 중심이</text><text class="kr" x="350.0" y="414.0" font-size="15" fill="#F8FAFC" font-weight="700">정치 갈등으로 이동</text><line x1="589.0" y1="215.0" x2="605.0" y2="215.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="608" y="120" width="258" height="190" rx="16" fill="#142034"/><text class="mono" x="630.0" y="154.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">STEP 03</text><text class="kr" x="630.0" y="190.0" font-size="20" fill="#F8FAFC" font-weight="800">커뮤니티 여론</text><text class="mono" x="630.0" y="224.0" font-size="10.5" fill="#5B6B82" letter-spacing="1.5">DATA</text><text class="kr" x="630.0" y="250.0" font-size="14" fill="#E2E8F0">디시인사이드 등 4곳</text><text class="kr" x="630.0" y="274.0" font-size="14" fill="#E2E8F0">딥러닝 감성 · 비시민성</text><rect x="608" y="334" width="258" height="96" rx="14" fill="#FF7A6B" fill-opacity=".13"/><text class="mono" x="630.0" y="364.0" font-size="10.5" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">FINDING</text><text class="kr" x="630.0" y="390.0" font-size="15" fill="#F8FAFC" font-weight="700">부정 감성 높지만</text><text class="kr" x="630.0" y="414.0" font-size="15" fill="#F8FAFC" font-weight="700">법보다 정치 쟁점 겨냥</text><line x1="869.0" y1="215.0" x2="885.0" y2="215.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="888" y="120" width="258" height="190" rx="16" fill="#142034"/><text class="mono" x="910.0" y="154.0" font-size="11" fill="#8FA8FF" font-weight="700" letter-spacing="1.5">STEP 04</text><text class="kr" x="910.0" y="190.0" font-size="20" fill="#F8FAFC" font-weight="800">협회 유튜브</text><text class="mono" x="910.0" y="224.0" font-size="10.5" fill="#5B6B82" letter-spacing="1.5">DATA</text><text class="kr" x="910.0" y="250.0" font-size="14" fill="#E2E8F0">영상 31개 · 댓글 4,336개</text><text class="kr" x="910.0" y="274.0" font-size="14" fill="#E2E8F0">비교 자료로만 사용</text><rect x="888" y="334" width="258" height="96" rx="14" fill="#8FA8FF" fill-opacity=".13"/><text class="mono" x="910.0" y="364.0" font-size="10.5" fill="#8FA8FF" font-weight="700" letter-spacing="1.5">FINDING</text><text class="kr" x="910.0" y="390.0" font-size="15" fill="#F8FAFC" font-weight="700">긍정 0.7, 커뮤니티 0.3</text><text class="kr" x="910.0" y="414.0" font-size="15" fill="#F8FAFC" font-weight="700">관심층 반응으로 구분</text><text class="kr" x="48.0" y="470.0" font-size="13" fill="#FF7A6B" font-weight="700">데이터를 바꾼 이유</text><text class="kr" x="48.0" y="498.0" font-size="15" fill="#E2E8F0">협회는 자체 유튜브를 여론 분석의 중심으로 원했지만 영상이 31개뿐이고 협회 관심층의 반응에 치우쳐 있어,</text><text class="kr" x="48.0" y="524.0" font-size="15" fill="#E2E8F0">게시글이 쌓인 커뮤니티를 중심 데이터로, 유튜브는 비교 자료로 쓰자고 제안했습니다.</text></svg>