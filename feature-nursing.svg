<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="간호법 언론·여론 분석. 대한간호협회 의뢰. YTN 기사·방송 스크립트 605건을 11개 의제로 분류, 거부권 보도 68건 대 간호사 응원 보도 4건, 긍정 감성 협회 유튜브 0.7 대 커뮤니티 0.3."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="320" rx="26" fill="#0E1726"/><rect width="1200" height="320" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#FF7A6B"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#FF7A6B" font-weight="700" letter-spacing="2">FEATURED 02</text><text class="kr" x="206.0" y="65.0" font-size="13.5" fill="#94A3B8">2023.06 – 2023.12  ·  대한간호협회 의뢰 연구  ·  분석 전담</text><text class="kr" x="50.0" y="132.0" font-size="36" fill="#F8FAFC" font-weight="800">간호법 언론 · 여론 분석</text><text class="kr" x="52.0" y="176.0" font-size="18" fill="#E2E8F0">보도가 늘어난 만큼 간호사에 대한 관심도 늘었을까?</text><rect x="52" y="245" width="85" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="64.0" y="262.5" font-size="13" fill="#FF7A6B" font-weight="700">Generate</text><rect x="147.3262" y="245" width="128" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="159.3" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">LDA · 의미연결망</text><rect x="285.0987" y="245" width="119" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="297.1" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">딥러닝 감성 분석</text><rect x="413.766" y="245" width="74" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="425.8" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">빅카인즈</text><line x1="716" y1="40" x2="716" y2="280" stroke="#22324A"/><text class="en" x="752.0" y="92.0" font-size="30" fill="#FF7A6B" font-weight="800">605건</text><text class="kr" x="752.0" y="120.0" font-size="15.5" fill="#94A3B8">YTN 기사 · 방송 스크립트를 11개 의제로 분류</text><text class="en" x="752.0" y="174.0" font-size="30" fill="#FF7A6B" font-weight="800">68 : 4</text><text class="kr" x="752.0" y="202.0" font-size="15.5" fill="#94A3B8">거부권 보도 대 간호사 응원 · 감사 보도</text><text class="en" x="752.0" y="256.0" font-size="30" fill="#FF7A6B" font-weight="800">0.7 vs 0.3</text><text class="kr" x="752.0" y="284.0" font-size="15.5" fill="#94A3B8">긍정 감성, 협회 유튜브 대 온라인 커뮤니티</text></svg>