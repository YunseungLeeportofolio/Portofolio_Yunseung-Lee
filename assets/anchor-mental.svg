<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="청년 우울감 경험률 2014년 4.5%에서 2021년 7.0%, 2023년 6.9%. 2022 → 2024년 우울증상 유병률 3.3% → 7.9%, 정신건강 미충족 의료 2.5% → 5.6%. 청년 자살률 2021년 26.61명, 2023년 23.59명(10만 명당).">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40.0" y="62.0" font-size="23" fill="#1F2328" font-weight="800">우울은 늘었고, 필요한 도움은 따라가지 못했습니다</text>

  <!-- 우울감 경험률 추이 -->
  <g>
    <text class="kr" x="60.0" y="112.0" font-size="14" fill="#6E7781" font-weight="600">우울감 경험률 (%)</text>
    <line x1="90" y1="314.0" x2="620" y2="314.0" stroke="#EAEEF2"/>
    <text class="en" x="78.0" y="319.0" font-size="13" fill="#6E7781" text-anchor="end">4</text>
    <line x1="90" y1="222.0" x2="620" y2="222.0" stroke="#EAEEF2"/>
    <text class="en" x="78.0" y="227.0" font-size="13" fill="#6E7781" text-anchor="end">6</text>
    <line x1="90" y1="130.0" x2="620" y2="130.0" stroke="#EAEEF2"/>
    <text class="en" x="78.0" y="135.0" font-size="13" fill="#6E7781" text-anchor="end">8</text>
    <rect x="423.3" y="124" width="216.7" height="242" rx="10" fill="#FBE9E7" opacity=".6"/>
    <text class="kr" x="435.3" y="144.0" font-size="13" fill="#C9473C" font-weight="700">2020년 이후</text>
    <polyline points="90.0,291.0 148.9,300.2 207.8,245.0 266.7,254.2 325.6,281.8 384.4,295.6 443.3,226.6 502.2,176.0 561.1,212.8 620.0,180.6" fill="none" stroke="#C9473C" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="90.0" cy="291.0" r="5" fill="#C9473C"/>
    <text class="en" x="90.0" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">14</text>
    <text class="en" x="90.0" y="277.0" font-size="15" fill="#C9473C" font-weight="800" text-anchor="middle">4.5</text>
    <circle cx="148.9" cy="300.2" r="5" fill="#C9473C"/>
    <text class="en" x="148.9" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">15</text>
    <circle cx="207.8" cy="245.0" r="5" fill="#C9473C"/>
    <text class="en" x="207.8" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">16</text>
    <circle cx="266.7" cy="254.2" r="5" fill="#C9473C"/>
    <text class="en" x="266.7" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">17</text>
    <circle cx="325.6" cy="281.8" r="5" fill="#C9473C"/>
    <text class="en" x="325.6" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">18</text>
    <circle cx="384.4" cy="295.6" r="5" fill="#C9473C"/>
    <text class="en" x="384.4" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">19</text>
    <circle cx="443.3" cy="226.6" r="5" fill="#C9473C"/>
    <text class="en" x="443.3" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">20</text>
    <circle cx="502.2" cy="176.0" r="5" fill="#C9473C"/>
    <text class="en" x="502.2" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">21</text>
    <text class="en" x="502.2" y="162.0" font-size="15" fill="#C9473C" font-weight="800" text-anchor="middle">7.0</text>
    <circle cx="561.1" cy="212.8" r="5" fill="#C9473C"/>
    <text class="en" x="561.1" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">22</text>
    <circle cx="620.0" cy="180.6" r="5" fill="#C9473C"/>
    <text class="en" x="620.0" y="388.0" font-size="13" fill="#6E7781" text-anchor="middle">23</text>
    <text class="en" x="620.0" y="166.6" font-size="15" fill="#C9473C" font-weight="800" text-anchor="middle">6.9</text>
  </g>

  <!-- 2022 → 2024 비교 -->
  <g>
    <text class="kr" x="700.0" y="112.0" font-size="14" fill="#6E7781" font-weight="600">2022년 → 2024년</text>
    <text class="kr" x="700.0" y="144.0" font-size="17" fill="#1F2328" font-weight="800">우울증상 유병률</text>
    <text class="en" x="700.0" y="178.0" font-size="13" fill="#6E7781">2022</text>
    <rect x="748" y="158" width="132.0" height="26" rx="6" fill="#AEB9C7"/>
    <text class="en" x="890.0" y="178.0" font-size="17" fill="#6E7781" font-weight="800">3.3%</text>
    <text class="en" x="700.0" y="212.0" font-size="13" fill="#6E7781">2024</text>
    <rect x="748" y="192" width="316.0" height="26" rx="6" fill="#C9473C"/>
    <text class="en" x="1074.0" y="212.0" font-size="17" fill="#C9473C" font-weight="800">7.9%</text>
    <text class="kr" x="1160.0" y="144.0" font-size="17" fill="#C9473C" font-weight="800" text-anchor="end">2.4배</text>
    <text class="kr" x="700.0" y="264.0" font-size="17" fill="#1F2328" font-weight="800">정신건강 미충족 의료</text>
    <text class="en" x="700.0" y="298.0" font-size="13" fill="#6E7781">2022</text>
    <rect x="748" y="278" width="100.0" height="26" rx="6" fill="#AEB9C7"/>
    <text class="en" x="858.0" y="298.0" font-size="17" fill="#6E7781" font-weight="800">2.5%</text>
    <text class="en" x="700.0" y="332.0" font-size="13" fill="#6E7781">2024</text>
    <rect x="748" y="312" width="224.0" height="26" rx="6" fill="#C9473C"/>
    <text class="en" x="982.0" y="332.0" font-size="17" fill="#C9473C" font-weight="800">5.6%</text>
    <text class="kr" x="1160.0" y="264.0" font-size="17" fill="#C9473C" font-weight="800" text-anchor="end">2.2배</text>
  </g>

  <!-- 출처 -->
  <text class="kr" x="40.0" y="440.0" font-size="13.5" fill="#6E7781">청년 자살률(10만 명당)은 2021년 26.61명으로 분석 기간 최고, 2023년 23.59명 · 출처: Big-데이터웨이브, KOSIS</text>
</svg>
