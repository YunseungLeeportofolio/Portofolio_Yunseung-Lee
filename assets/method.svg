<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" width="1200" height="384" role="img" aria-label="Disaggregate, Integrate, Generate: 데이터를 쪼개고, 합치고, 새로 모으는 세 가지 방법"><style> .kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace} .drift1{animation:d1 6s ease-in-out infinite} .drift3{animation:d3 6s ease-in-out infinite} @keyframes d1{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} @keyframes d3{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}} .flow{stroke-dasharray:3 7;animation:flow 2.4s linear infinite} @keyframes flow{to{stroke-dashoffset:-20}} .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}} .fill{opacity:0;animation:fill 6s ease-in-out infinite} @keyframes fill{0%,12%{opacity:0}22%,82%{opacity:1}94%,100%{opacity:0}} </style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="384" rx="28" fill="#0E1726"/><rect width="1200" height="384" rx="28" fill="url(#g)"/><line x1="400" y1="44" x2="400" y2="340" stroke="#22324A"/><line x1="800" y1="44" x2="800" y2="340" stroke="#22324A"/><text class="mono" x="46" y="74" font-size="13" fill="#FF7A6B" letter-spacing="2">01</text><line x1="226" y1="74" x2="270" y2="74" stroke="#94A3B8" stroke-width="1.5"/><text class="mono" x="226" y="66" font-size="10" fill="#5B6B82">μ</text><g class="drift1"><path d="M270 74 C300 74 310 52 344 52" fill="none" stroke="#FF7A6B" stroke-width="1.5" stroke-opacity=".85"/><circle cx="348" cy="52" r="4.5" fill="#FF7A6B"/></g><g><path d="M270 74 C300 74 310 74 344 74" fill="none" stroke="#FF7A6B" stroke-width="1.5" stroke-opacity=".85"/><circle cx="348" cy="74" r="4.5" fill="#FF7A6B"/></g><g class="drift3"><path d="M270 74 C300 74 310 96 344 96" fill="none" stroke="#FF7A6B" stroke-width="1.5" stroke-opacity=".85"/><circle cx="348" cy="96" r="4.5" fill="#FF7A6B"/></g><text class="en" x="45" y="150" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-.5">Disaggregate</text><text class="kr" x="46" y="180" font-size="15" font-weight="700" fill="#FF7A6B">쪼갠다</text><text class="kr" x="46" y="216" font-size="16" fill="#E2E8F0">평균으로 묶인 수치를</text><text class="kr" x="46" y="241" font-size="16" fill="#E2E8F0">집단·지역·시점별로 세분화합니다.</text><line x1="46" y1="270" x2="70" y2="270" stroke="#FF7A6B" stroke-width="1.5"/><text class="mono" x="80" y="274" font-size="10.5" fill="#5B6B82" letter-spacing="2">CASE</text><text class="kr" x="46" y="300" font-size="13.5" fill="#94A3B8">사용후핵연료 기사 5,171건을</text><text class="kr" x="46" y="321" font-size="13.5" fill="#94A3B8">전국지와 지역지로 나누자, 평균에</text><text class="kr" x="46" y="342" font-size="13.5" fill="#94A3B8">가려져 있던 지역의 의제가 드러났습니다.</text><text class="mono" x="446" y="74" font-size="13" fill="#2AC1BC" letter-spacing="2">02</text><rect x="628" y="52" width="5" height="10" rx="1" fill="#94A3B8"/><rect x="636" y="44" width="5" height="18" rx="1" fill="#94A3B8"/><rect x="644" y="49" width="5" height="13" rx="1" fill="#94A3B8"/><rect x="628" y="84" width="26" height="2" rx="1" fill="#94A3B8"/><rect x="628" y="90" width="20" height="2" rx="1" fill="#94A3B8"/><rect x="628" y="96" width="24" height="2" rx="1" fill="#94A3B8"/><path class="flow" d="M658 54 C696 54 702 74 736 74" fill="none" stroke="#2AC1BC" stroke-width="1.5"/><path class="flow" d="M658 90 C696 90 702 74 736 74" fill="none" stroke="#2AC1BC" stroke-width="1.5"/><circle cx="744" cy="74" r="8" fill="none" stroke="#2AC1BC" stroke-width="1.5"/><circle class="pulse" cx="744" cy="74" r="3.5" fill="#2AC1BC"/><text class="en" x="445" y="150" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-.5">Integrate</text><text class="kr" x="446" y="180" font-size="15" font-weight="700" fill="#2AC1BC">합친다</text><text class="kr" x="446" y="216" font-size="16" fill="#E2E8F0">텍스트와 통계처럼 성격이 다른 데이터를</text><text class="kr" x="446" y="241" font-size="16" fill="#E2E8F0">하나의 구조 위에서 함께 읽습니다.</text><line x1="446" y1="270" x2="470" y2="270" stroke="#2AC1BC" stroke-width="1.5"/><text class="mono" x="480" y="274" font-size="10.5" fill="#5B6B82" letter-spacing="2">CASE</text><text class="kr" x="446" y="300" font-size="13.5" fill="#94A3B8">기사 22,292건의 보도 비중을 실제 청년</text><text class="kr" x="446" y="321" font-size="13.5" fill="#94A3B8">통계와 맞대어, 실제보다 덜 보도된</text><text class="kr" x="446" y="342" font-size="13.5" fill="#94A3B8">문제를 하나의 결론으로 짚어냈습니다.</text><text class="mono" x="846" y="74" font-size="13" fill="#F5B841" letter-spacing="2">03</text><circle cx="1036" cy="54" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1062" cy="54" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle class="fill" style="animation-delay:0.0s" cx="1062" cy="54" r="5" fill="#F5B841"/><circle cx="1088" cy="54" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1114" cy="54" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1140" cy="54" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1036" cy="74" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1062" cy="74" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle class="fill" style="animation-delay:1.5s" cx="1062" cy="74" r="5" fill="#F5B841"/><circle cx="1088" cy="74" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1114" cy="74" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle class="fill" style="animation-delay:0.5s" cx="1114" cy="74" r="5" fill="#F5B841"/><circle cx="1140" cy="74" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1036" cy="94" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle class="fill" style="animation-delay:1.0s" cx="1036" cy="94" r="5" fill="#F5B841"/><circle cx="1062" cy="94" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1088" cy="94" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1114" cy="94" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle cx="1140" cy="94" r="5" fill="none" stroke="#5B6B82" stroke-width="1.2" stroke-dasharray="2 2"/><circle class="fill" style="animation-delay:2.0s" cx="1140" cy="94" r="5" fill="#F5B841"/><text class="en" x="845" y="150" font-size="38" font-weight="700" fill="#F8FAFC" letter-spacing="-.5">Generate</text><text class="kr" x="846" y="180" font-size="15" font-weight="700" fill="#F5B841">새로 모은다</text><text class="kr" x="846" y="216" font-size="16" fill="#E2E8F0">기존 데이터가 질문에 맞지 않으면</text><text class="kr" x="846" y="241" font-size="16" fill="#E2E8F0">현장에서 고쳐 새로 만듭니다.</text><line x1="846" y1="270" x2="870" y2="270" stroke="#F5B841" stroke-width="1.5"/><text class="mono" x="880" y="274" font-size="10.5" fill="#5B6B82" letter-spacing="2">CASE</text><text class="kr" x="846" y="300" font-size="13.5" fill="#94A3B8">관광객이 설문에서 막히는 이유를 현장에서</text><text class="kr" x="846" y="321" font-size="13.5" fill="#94A3B8">묻고 문항과 안내 자료를 고쳐,</text><text class="kr" x="846" y="342" font-size="13.5" fill="#94A3B8">할당 대비 150%의 응답을 확보했습니다.</text></svg>