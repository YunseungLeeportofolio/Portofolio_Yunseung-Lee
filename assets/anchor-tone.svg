  <text class="kr" x="40.0" y="510.0" font-size="14.5" fill="#424A53">인구 유출은 위기 의제인데도 대응 정책 · 지원 사업 소개 위주로 긍정 논조가 우세했고, 대출 · 주거 비용은 긍정과 부정의 차이가 없었습니다.</text>
  <!-- 출처 -->
  <text class="kr" x="40.0" y="560.0" font-size="13.5" fill="#6E7781">의제별 기사의 긍정 · 부정 감성 점수 차이 t-검정 (n.s. = 유의하지 않음) · 「2026년 부산 청년 실태보고서」</text>
