<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Field work: 서던포스트 외국인 관광객 현장 설문조사원(2018) — 응답 시간 20분에서 10분으로 단축, 할당 대비 150% 응답 확보. 영남체육신문 축구부 기자(2021–2024) — 27개월간 포항 스틸러스·부산 아이파크 현장 취재."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="300" rx="26" fill="#0E1726"/><rect width="1200" height="300" rx="26" fill="url(#g)"/><rect x="24" y="24" width="564" height="252" rx="18" fill="#142034"/><text class="kr" x="52.0" y="70.0" font-size="13" fill="#FF7A6B" font-weight="700">2018.06 – 2018.11 · 서던포스트</text><text class="kr" x="52.0" y="108.0" font-size="23" fill="#F8FAFC" font-weight="800">외국인 관광객 현장 설문조사원</text><text class="kr" x="52.0" y="144.0" font-size="15.5" fill="#E2E8F0">응답이 막히는 이유를 현장에서 직접 묻고,</text><text class="kr" x="52.0" y="169.0" font-size="15.5" fill="#E2E8F0">사진 안내 책자와 쉬운 문항으로 바꿨습니다.</text><text class="en" x="52.0" y="238.0" font-size="30" fill="#FF7A6B" font-weight="700">20→10분</text><text class="kr" x="52.0" y="264.0" font-size="13.5" fill="#94A3B8">응답 시간</text><text class="en" x="292.0" y="238.0" font-size="30" fill="#FF7A6B" font-weight="700">150%</text><text class="kr" x="292.0" y="264.0" font-size="13.5" fill="#94A3B8">할당 대비 응답 · 80 → 120명</text><rect x="612" y="24" width="564" height="252" rx="18" fill="#142034"/><text class="kr" x="640.0" y="70.0" font-size="13" fill="#F5B841" font-weight="700">2021.10 – 2024.01 · 영남체육신문</text><text class="kr" x="640.0" y="108.0" font-size="23" fill="#F8FAFC" font-weight="800">축구부 기자</text><text class="kr" x="640.0" y="144.0" font-size="15.5" fill="#E2E8F0">포항 스틸러스와 부산 아이파크를 현장에서 취재하며</text><text class="kr" x="640.0" y="169.0" font-size="15.5" fill="#E2E8F0">데이터 저널리즘 기사와 팬덤 탐사 기사를 썼습니다.</text><text class="en" x="640.0" y="238.0" font-size="30" fill="#F5B841" font-weight="700">27개월</text><text class="kr" x="640.0" y="264.0" font-size="13.5" fill="#94A3B8">현장 취재</text><text class="en" x="880.0" y="238.0" font-size="30" fill="#F5B841" font-weight="700">2개 구단</text><text class="kr" x="880.0" y="264.0" font-size="13.5" fill="#94A3B8">포항 · 부산 담당</text></svg>