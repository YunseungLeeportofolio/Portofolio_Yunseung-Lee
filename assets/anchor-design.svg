<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img"
     aria-label="분석 설계. 통계: Big-데이터웨이브·KOSIS 청년 통계 수집, 상관분석으로 청년 6·외국인 청년 4개 부문 지표 정리, 연령대 세분화. 언론: 부산일보·국제신문 청년·유학생 기사 22,391건(2021.04–2026.04)을 BERTopic으로 청년 8개·유학생 5개 의제로 분류하고 의미연결망, 감성 분석과 의제별 t-검정, 월별 시계열 분석. 일자리·인구 유출·주거·정신건강·유학생 다섯 의제 기준으로 현실과 보도를 대조하고, 간극을 설문 약 500명·인터뷰 40여 명 문항으로 연결.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;letter-spacing:1.5px}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="489" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40" y="62" font-size="23" fill="#1F2328" font-weight="800">통계와 기사를 따로 분석한 뒤, 같은 의제 기준으로 맞대었습니다</text>

  <!-- 통계 분석 -->
  <g>
    <text class="kr" x="40" y="167" font-size="20" fill="#1C7C74" font-weight="800">통계</text>
    <rect x="110" y="100" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="130" y="132" font-size="12" fill="#1C7C74" font-weight="700">01</text>
    <text class="kr" x="130" y="162" font-size="19" fill="#1F2328" font-weight="800">청년 통계 수집</text>
    <text class="kr" x="130" y="188" font-size="14" fill="#424A53">Big-데이터웨이브</text>
    <text class="kr" x="130" y="208" font-size="14" fill="#424A53">KOSIS</text>
    <line x1="324" y1="160" x2="336" y2="160" stroke="#6E7781" stroke-width="2"/>
    <path d="M334 154 L342 160 L334 166" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="350" y="100" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="370" y="132" font-size="12" fill="#1C7C74" font-weight="700">02</text>
    <text class="kr" x="370" y="162" font-size="19" fill="#1F2328" font-weight="800">실태 지표 정리</text>
    <text class="kr" x="370" y="188" font-size="14" fill="#424A53">상관분석으로 변인 확인</text>
    <text class="kr" x="370" y="208" font-size="14" fill="#424A53">청년 6 · 외국인 청년 4개 부문</text>
    <line x1="564" y1="160" x2="576" y2="160" stroke="#6E7781" stroke-width="2"/>
    <path d="M574 154 L582 160 L574 166" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="100" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="610" y="132" font-size="12" fill="#1C7C74" font-weight="700">03</text>
    <text class="kr" x="610" y="162" font-size="19" fill="#1F2328" font-weight="800">연령대 세분화</text>
    <text class="kr" x="610" y="188" font-size="14" fill="#424A53">만 18–39세를</text>
    <text class="kr" x="610" y="208" font-size="14" fill="#424A53">생애 단계별로 나눔</text>
    <line x1="804" y1="160" x2="854" y2="160" stroke="#1C7C74" stroke-width="2"/>
    <path d="M852 154 L860 160 L852 166" fill="none" stroke="#1C7C74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 언론 분석 -->
  <g>
    <text class="kr" x="40" y="315" font-size="20" fill="#B4691F" font-weight="800">언론</text>
    <rect x="110" y="248" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="130" y="280" font-size="12" fill="#B4691F" font-weight="700">01</text>
    <text class="kr" x="130" y="310" font-size="19" fill="#1F2328" font-weight="800">기사 22,391건</text>
    <text class="kr" x="130" y="336" font-size="14" fill="#424A53">부산일보 · 국제신문</text>
    <text class="kr" x="130" y="356" font-size="14" fill="#424A53">2021.04 – 2026.04</text>
    <line x1="324" y1="308" x2="336" y2="308" stroke="#6E7781" stroke-width="2"/>
    <path d="M334 302 L342 308 L334 314" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="350" y="248" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="370" y="280" font-size="12" fill="#B4691F" font-weight="700">02</text>
    <text class="kr" x="370" y="310" font-size="19" fill="#1F2328" font-weight="800">BERTopic</text>
    <text class="kr" x="370" y="336" font-size="14" fill="#424A53">청년 8개 · 유학생 5개</text>
    <text class="kr" x="370" y="356" font-size="14" fill="#424A53">의제로 분류, 의미연결망</text>
    <line x1="564" y1="308" x2="576" y2="308" stroke="#6E7781" stroke-width="2"/>
    <path d="M574 302 L582 308 L574 314" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="248" width="206" height="120" rx="14" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="610" y="280" font-size="12" fill="#B4691F" font-weight="700">03</text>
    <text class="kr" x="610" y="310" font-size="19" fill="#1F2328" font-weight="800">감성 · 시계열</text>
    <text class="kr" x="610" y="336" font-size="14" fill="#424A53">의제별 논조 t-검정과</text>
    <text class="kr" x="610" y="356" font-size="14" fill="#424A53">월별 보도량 변화</text>
    <line x1="804" y1="308" x2="854" y2="308" stroke="#B4691F" stroke-width="2"/>
    <path d="M852 302 L860 308 L852 314" fill="none" stroke="#B4691F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 대조 -->
  <g>
    <rect x="868" y="100" width="292" height="268" rx="16" fill="#FBE9E7" stroke="#C9473C" stroke-opacity=".5"/>
    <text class="mono" x="892" y="136" font-size="12" fill="#C9473C" font-weight="700">04</text>
    <text class="kr" x="892" y="170" font-size="21" fill="#1F2328" font-weight="800">현실과 보도 대조</text>
    <text class="kr" x="892" y="208" font-size="15" fill="#424A53">다섯 의제를 기준으로</text>
    <text class="kr" x="892" y="234" font-size="15" fill="#424A53">통계가 보여 준 현실과</text>
    <text class="kr" x="892" y="260" font-size="15" fill="#424A53">보도 비중 · 논조를 비교</text>
    <text class="kr" x="892" y="314" font-size="14.5" fill="#C9473C" font-weight="700">일자리 · 인구 유출 · 주거</text>
    <text class="kr" x="892" y="338" font-size="14.5" fill="#C9473C" font-weight="700">정신건강 · 유학생</text>
  </g>

  <!-- 다음 단계 -->
  <rect x="40" y="398" width="1120" height="56" rx="14" fill="#E6F3F1"/>
  <text class="kr" x="64" y="433" font-size="16" fill="#424A53"><tspan font-weight="800" fill="#1C7C74">다음 단계</tspan><tspan dx="16">찾은 간극을 설문(약 500명) · 인터뷰(40여 명) 문항으로 바꿔 당사자에게 다시 확인</tspan></text>
</svg>
