<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="Toolkit: 텍스트 분석, 행위자 기반 모델링(ABM), 통계·설문·실험, 데이터 수집(웹 스크래핑·크롤링). 도구: Python, R, SPSS, AMOS, Mplus, NetLogo, Mesa, Tableau, Google Colab, PyCharm.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 1. Text Analysis -->
  <g>
    <rect x="48.0" y="62" width="46" height="3" rx="1.5" fill="#1C7C74" fill-opacity="1.00"/>
    <rect x="48.0" y="71" width="34" height="3" rx="1.5" fill="#1C7C74" fill-opacity="0.82"/>
    <rect x="48.0" y="80" width="42" height="3" rx="1.5" fill="#1C7C74" fill-opacity="0.64"/>
    <rect x="48.0" y="89" width="26" height="3" rx="1.5" fill="#1C7C74" fill-opacity="0.46"/>
    <text class="en" x="48" y="150" font-size="30" fill="#1F2328" font-weight="700" letter-spacing="-.5">Text Analysis</text>
    <text class="kr" x="48" y="178" font-size="14.5" fill="#1C7C74" font-weight="700">텍스트 분석</text>
    <text class="kr" x="48" y="220" font-size="15" fill="#424A53">토픽 모델링 · 감성·감정 분류</text>
    <text class="kr" x="48" y="247" font-size="15" fill="#424A53">혐오·무례 표현 탐지 (딥러닝 분류)</text>
    <text class="kr" x="48" y="274" font-size="15" fill="#424A53">키워드 네트워크 · 의미연결망</text>
    <text class="mono" x="48" y="316" font-size="11" fill="#6E7781" letter-spacing="1.5">PYTHON</text>
  </g>

  <!-- 2. Agent-Based -->
  <g>
    <line x1="324" y1="48" x2="324" y2="330" stroke="#EAEEF2"/>
    <line x1="358.0" y1="68" x2="370.0" y2="86" stroke="#C9473C" stroke-opacity=".5"/>
    <line x1="382.0" y1="64" x2="370.0" y2="86" stroke="#C9473C" stroke-opacity=".5"/>
    <line x1="370.0" y1="86" x2="396.0" y2="84" stroke="#C9473C" stroke-opacity=".5"/>
    <line x1="370.0" y1="86" x2="360.0" y2="94" stroke="#C9473C" stroke-opacity=".5"/>
    <circle cx="358.0" cy="68" r="4" fill="#C9473C"/>
    <circle cx="382.0" cy="64" r="4" fill="#C9473C"/>
    <circle cx="370.0" cy="86" r="4" fill="#C9473C"/>
    <circle cx="396.0" cy="84" r="4" fill="#C9473C"/>
    <circle cx="360.0" cy="94" r="4" fill="#C9473C"/>
    <text class="en" x="352" y="150" font-size="30" fill="#1F2328" font-weight="700" letter-spacing="-.5">Agent-Based</text>
    <text class="kr" x="352" y="178" font-size="14.5" fill="#C9473C" font-weight="700">행위자 기반 모델링 (ABM)</text>
    <text class="kr" x="352" y="220" font-size="15" fill="#424A53">개인의 행동 규칙으로</text>
    <text class="kr" x="352" y="247" font-size="15" fill="#424A53">집단의 변화를 시뮬레이션</text>
    <text class="kr" x="352" y="274" font-size="15" fill="#424A53">위치·소비 기록 기반 행동 예측</text>
    <text class="mono" x="352" y="316" font-size="11" fill="#6E7781" letter-spacing="1.5">NETLOGO · MESA</text>
  </g>

  <!-- 3. Statistics -->
  <g>
    <line x1="600" y1="48" x2="600" y2="330" stroke="#EAEEF2"/>
    <rect x="628.0" y="82" width="7" height="14" rx="1.5" fill="#B4691F" fill-opacity=".45"/>
    <rect x="639.0" y="74" width="7" height="22" rx="1.5" fill="#B4691F" fill-opacity=".45"/>
    <rect x="650.0" y="78" width="7" height="18" rx="1.5" fill="#B4691F" fill-opacity=".45"/>
    <rect x="661.0" y="66" width="7" height="30" rx="1.5" fill="#B4691F" fill-opacity=".45"/>
    <line x1="626.0" y1="90" x2="672.0" y2="66" stroke="#B4691F" stroke-width="2"/>
    <text class="en" x="628" y="150" font-size="30" fill="#1F2328" font-weight="700" letter-spacing="-.5">Statistics</text>
    <text class="kr" x="628" y="178" font-size="14.5" fill="#B4691F" font-weight="700">통계 · 설문 · 실험</text>
    <text class="kr" x="628" y="220" font-size="15" fill="#424A53">회귀 · 매개 · 조절 분석</text>
    <text class="kr" x="628" y="247" font-size="15" fill="#424A53">구조방정식 · 다집단 분석</text>
    <text class="kr" x="628" y="274" font-size="15" fill="#424A53">설문 · 실험 설계</text>
    <text class="mono" x="628" y="316" font-size="11" fill="#6E7781" letter-spacing="1.5">SPSS · AMOS · MPLUS · R</text>
  </g>

  <!-- 4. Data Collection -->
  <g>
    <line x1="876" y1="48" x2="876" y2="330" stroke="#EAEEF2"/>
    <path d="M906.0 66 H948.0 L932.0 82 V96 L922.0 90 V82 Z" fill="none" stroke="#3563C9" stroke-width="2" stroke-linejoin="round"/>
    <text class="en" x="904" y="150" font-size="30" fill="#1F2328" font-weight="700" letter-spacing="-.5">Data Collection</text>
    <text class="kr" x="904" y="178" font-size="14.5" fill="#3563C9" font-weight="700">데이터 수집</text>
    <text class="kr" x="904" y="220" font-size="15" fill="#424A53">웹 스크래핑 · 크롤링</text>
    <text class="kr" x="904" y="247" font-size="15" fill="#424A53">유튜브 댓글·자막 · 뉴스 · 커뮤니티</text>
    <text class="kr" x="904" y="274" font-size="15" fill="#424A53">현장 설문 · 심층 인터뷰</text>
    <text class="mono" x="904" y="316" font-size="11" fill="#6E7781" letter-spacing="1.5">PYTHON</text>
  </g>

  <!-- 도구 -->
  <g>
    <line x1="48" y1="360" x2="1152" y2="360" stroke="#EAEEF2"/>
    <text class="mono" x="48" y="412" font-size="11" fill="#6E7781" letter-spacing="2">TOOLS</text>
    <rect x="128" y="389" width="80" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="167.8" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">Python</text>
    <rect x="217.6" y="389" width="37" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="235.9" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">R</text>
    <rect x="264.2" y="389" width="62" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="295.4" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">SPSS</text>
    <rect x="336.6" y="389" width="62" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="367.8" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">AMOS</text>
    <rect x="409" y="389" width="71" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="444.5" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">Mplus</text>
    <rect x="490" y="389" width="88" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="534.1" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">NetLogo</text>
    <rect x="588.2" y="389" width="62" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="619.4" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">Mesa</text>
    <rect x="660.6" y="389" width="88" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="704.7" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">Tableau</text>
    <rect x="758.8" y="389" width="131" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="824.4" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">Google Colab</text>
    <rect x="900" y="389" width="88" height="34" rx="17" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="en" x="944.1" y="411" font-size="14" fill="#424A53" font-weight="600" text-anchor="middle">PyCharm</text>
  </g>
</svg>
