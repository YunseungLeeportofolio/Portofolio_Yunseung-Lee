<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Research in progress: 위치·소비 데이터 기반 행위자 모델(진행 중), 사용후핵연료 보도의 지역 격차(2025 한국소통학회 발표), 언론·유튜브·커뮤니티의 이슈 지도(2025 한국방송학회 발표), 2025 대선 유튜브 댓글의 혐오표현(원고 작성 중)."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="640" rx="26" fill="#0E1726"/><rect width="1200" height="640" rx="26" fill="url(#g)"/><rect x="24" y="24" width="564" height="284" rx="18" fill="#142034"/><rect x="52.0" y="55.0" width="62" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="64.0" y="72.5" font-size="12.5" fill="#FF7A6B" font-weight="700">진행 중</text><text class="kr" x="52.0" y="120.0" font-size="23" fill="#F8FAFC" font-weight="800">위치·소비 데이터 기반 행위자 모델</text><text class="kr" x="52.0" y="152.0" font-size="16" fill="#E2E8F0">사람들의 이동과 소비 기록으로 다음 행동을 예측할 수 있을까?</text><line x1="52" y1="174" x2="560" y2="174" stroke="#22324A"/><text class="mono" x="52.0" y="206.0" font-size="11" fill="#FF7A6B" letter-spacing="1.5">DATA</text><text class="kr" x="136.0" y="206.0" font-size="15.5" fill="#E2E8F0">설문 참여자의 위치 · 카드 사용 · 미디어 이용 기록</text><text class="mono" x="52.0" y="236.0" font-size="11" fill="#FF7A6B" letter-spacing="1.5">METHOD</text><text class="kr" x="136.0" y="236.0" font-size="15.5" fill="#E2E8F0">행위자 기반 모델링(ABM) · NetLogo · Mesa</text><text class="mono" x="52.0" y="266.0" font-size="11" fill="#FF7A6B" letter-spacing="1.5">FOCUS</text><text class="kr" x="136.0" y="266.0" font-size="15.5" fill="#E2E8F0">응답(말)과 이동·소비(행동)를 함께 보는 예측 모델</text><rect x="612" y="24" width="564" height="284" rx="18" fill="#142034"/><rect x="640.0" y="55.0" width="152" height="26" rx="13" fill="#2AC1BC" fill-opacity=".14"/><text class="kr" x="652.0" y="72.5" font-size="12.5" fill="#2AC1BC" font-weight="700">2025 한국소통학회 발표</text><text class="kr" x="640.0" y="120.0" font-size="23" fill="#F8FAFC" font-weight="800">사용후핵연료 보도의 지역 격차</text><text class="kr" x="640.0" y="152.0" font-size="16" fill="#E2E8F0">전국지와 지역지는 같은 이슈를 같은 시선으로 볼까?</text><line x1="640" y1="174" x2="1148" y2="174" stroke="#22324A"/><text class="mono" x="640.0" y="206.0" font-size="11" fill="#2AC1BC" letter-spacing="1.5">DATA</text><text class="kr" x="724.0" y="206.0" font-size="15.5" fill="#E2E8F0">고준위 방사성 폐기물 기사 5,171건 (2023.08–2025.03)</text><text class="mono" x="640.0" y="236.0" font-size="11" fill="#2AC1BC" letter-spacing="1.5">METHOD</text><text class="kr" x="724.0" y="236.0" font-size="15.5" fill="#E2E8F0">BERTopic · KOTE 감성 분석 · 시계열 분석</text><text class="mono" x="640.0" y="266.0" font-size="11" fill="#2AC1BC" letter-spacing="1.5">FINDING</text><text class="kr" x="724.0" y="266.0" font-size="15.5" fill="#E2E8F0">지역지는 입지·안전에 집중하고 모든 토픽에서 더 부정적</text><rect x="24" y="332" width="564" height="284" rx="18" fill="#142034"/><rect x="52.0" y="363.0" width="152" height="26" rx="13" fill="#F5B841" fill-opacity=".14"/><text class="kr" x="64.0" y="380.5" font-size="12.5" fill="#F5B841" font-weight="700">2025 한국방송학회 발표</text><text class="kr" x="52.0" y="428.0" font-size="23" fill="#F8FAFC" font-weight="800">언론·유튜브·커뮤니티의 이슈 지도</text><text class="kr" x="52.0" y="460.0" font-size="16" fill="#E2E8F0">플랫폼마다 같은 정치 이슈를 다르게 말할까?</text><line x1="52" y1="482" x2="560" y2="482" stroke="#22324A"/><text class="mono" x="52.0" y="514.0" font-size="11" fill="#F5B841" letter-spacing="1.5">DATA</text><text class="kr" x="136.0" y="514.0" font-size="15.5" fill="#E2E8F0">기사 2,696 · 유튜브 자막 466 · 커뮤니티 27,678건</text><text class="mono" x="52.0" y="544.0" font-size="11" fill="#F5B841" letter-spacing="1.5">METHOD</text><text class="kr" x="136.0" y="544.0" font-size="15.5" fill="#E2E8F0">키워드 네트워크 · QAP 상관분석 · 인터뷰 34명</text><text class="mono" x="52.0" y="574.0" font-size="11" fill="#F5B841" letter-spacing="1.5">FINDING</text><text class="kr" x="136.0" y="574.0" font-size="15.5" fill="#E2E8F0">언론과 커뮤니티가 가장 닮았고, 쇼츠는 따로 움직임</text><rect x="612" y="332" width="564" height="284" rx="18" fill="#142034"/><rect x="640.0" y="363.0" width="89" height="26" rx="13" fill="#8FA8FF" fill-opacity=".14"/><text class="kr" x="652.0" y="380.5" font-size="12.5" fill="#8FA8FF" font-weight="700">원고 작성 중</text><text class="kr" x="640.0" y="428.0" font-size="23" fill="#F8FAFC" font-weight="800">2025 대선 유튜브 댓글의 혐오표현</text><text class="kr" x="640.0" y="460.0" font-size="16" fill="#E2E8F0">선거 기간 유튜브 댓글 속 혐오는 어떤 이슈와 함께 나타날까?</text><line x1="640" y1="482" x2="1148" y2="482" stroke="#22324A"/><text class="mono" x="640.0" y="514.0" font-size="11" fill="#8FA8FF" letter-spacing="1.5">DATA</text><text class="kr" x="724.0" y="514.0" font-size="15.5" fill="#E2E8F0">제21대 대통령 선거 기간 유튜브 댓글</text><text class="mono" x="640.0" y="544.0" font-size="11" fill="#8FA8FF" letter-spacing="1.5">METHOD</text><text class="kr" x="724.0" y="544.0" font-size="15.5" fill="#E2E8F0">혐오표현 탐지 · 주제 사전 구축 (10개 주제 · 208개 단어)</text><text class="mono" x="640.0" y="574.0" font-size="11" fill="#8FA8FF" letter-spacing="1.5">FOCUS</text><text class="kr" x="724.0" y="574.0" font-size="15.5" fill="#E2E8F0">탄핵 · 계엄 · 복지 · 양극화 등 이슈별 혐오표현의 분포</text></svg>