<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="총선 후보 유튜브, 무엇이 통했나. 제1저자. 부산 후보 35명의 유튜브 영상 376건. 공약 홍보 영상은 게시 비중 22.6%로 2위였지만 조회수 중앙값 348로 대면 선거 활동 영상 959보다 크게 낮음."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="320" rx="26" fill="#0E1726"/><rect width="1200" height="320" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#F5B841"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#F5B841" font-weight="700" letter-spacing="2">FEATURED 03</text><text class="kr" x="206.0" y="65.0" font-size="13.5" fill="#94A3B8">『사회과학연구』 32(4)  ·  2025  ·  제1저자</text><text class="kr" x="50.0" y="132.0" font-size="36" fill="#F8FAFC" font-weight="800">총선 후보 유튜브, 무엇이 통했나</text><text class="kr" x="52.0" y="176.0" font-size="18" fill="#E2E8F0">후보가 많이 올린 영상과 유권자가 반응한 영상은 같았을까?</text><rect x="52" y="245" width="115" height="26" rx="13" fill="#F5B841" fill-opacity=".14"/><text class="kr" x="64.0" y="262.5" font-size="13" fill="#F5B841" font-weight="700">Disaggregate</text><rect x="177.31980000000001" y="245" width="74" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="189.3" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">내용분석</text><rect x="261.1306" y="245" width="106" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="273.1" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">K-평균 군집화</text><rect x="377.4791" y="245" width="132" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="389.5" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">Kruskal-Wallis</text><line x1="716" y1="40" x2="716" y2="280" stroke="#22324A"/><text class="en" x="752.0" y="92.0" font-size="30" fill="#F5B841" font-weight="800">376건</text><text class="kr" x="752.0" y="120.0" font-size="15.5" fill="#94A3B8">제22대 총선 부산 후보 35명의 유튜브 영상</text><text class="en" x="752.0" y="174.0" font-size="30" fill="#F5B841" font-weight="800">22.6%</text><text class="kr" x="752.0" y="202.0" font-size="15.5" fill="#94A3B8">공약 홍보 영상의 게시 비중, 5개 유형 중 2위</text><text class="en" x="752.0" y="256.0" font-size="30" fill="#F5B841" font-weight="800">348 vs 959</text><text class="kr" x="752.0" y="284.0" font-size="15.5" fill="#94A3B8">조회수 중앙값, 공약 홍보 대 대면 선거 활동</text></svg>