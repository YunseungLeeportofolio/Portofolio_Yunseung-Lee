<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img"
     aria-label="협회 유튜브 댓글은 긍정 68%, 온라인 커뮤니티 4곳은 부정 77%. 커뮤니티별 부정 비율: 디시인사이드 78%, 에펨코리아 75%, 뽐뿌 73%, 일간베스트 74%.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="675" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 · 범례 -->
  <text class="kr" x="40" y="62" font-size="23" fill="#1F2328" font-weight="800">같은 간호법, 채널에 따라 감성이 정반대였습니다</text>
  <rect x="992" y="49" width="14" height="14" rx="3" fill="#1C7C74"/>
  <text class="kr" x="1012" y="62" font-size="15" fill="#424A53">긍정</text>
  <rect x="1068" y="49" width="14" height="14" rx="3" fill="#C9473C"/>
  <text class="kr" x="1088" y="62" font-size="15" fill="#424A53">부정</text>

  <!-- 1. 채널 비교 -->
  <text class="kr" x="40" y="116" font-size="15" fill="#6E7781" font-weight="700">채널 비교</text>
  <!-- 협회 유튜브 댓글 -->
  <g>
    <text class="kr" x="40" y="160" font-size="19" fill="#1F2328" font-weight="800">협회 유튜브 댓글</text>
    <text class="kr" x="40" y="184" font-size="14" fill="#6E7781">4,387건</text>
    <rect x="330" y="136" width="562.9" height="56" rx="6" fill="#1C7C74"/>
    <rect x="892.9" y="136" width="267.1" height="56" rx="6" fill="#C9473C"/>
    <rect x="886.9" y="136" width="12" height="56" fill="#C9473C"/>
    <rect x="886.9" y="136" width="6" height="56" fill="#1C7C74"/>
    <text class="kr" x="346" y="171.92" font-size="22" fill="#FFFFFF" font-weight="800">긍정 68%</text>
    <text class="kr" x="1144" y="171.92" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 32%</text>
  </g>
  <!-- 커뮤니티 4곳 합계 -->
  <g>
    <text class="kr" x="40" y="236" font-size="19" fill="#1F2328" font-weight="800">커뮤니티 4곳 합계</text>
    <text class="kr" x="40" y="260" font-size="14" fill="#6E7781">2,971건</text>
    <rect x="330" y="212" width="191.6" height="56" rx="6" fill="#1C7C74"/>
    <rect x="521.6" y="212" width="638.4" height="56" rx="6" fill="#C9473C"/>
    <rect x="515.6" y="212" width="12" height="56" fill="#C9473C"/>
    <rect x="515.6" y="212" width="6" height="56" fill="#1C7C74"/>
    <text class="kr" x="346" y="247.92" font-size="22" fill="#FFFFFF" font-weight="800">긍정 23%</text>
    <text class="kr" x="1144" y="247.92" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 77%</text>
  </g>

  <line x1="40" y1="304" x2="1160" y2="304" stroke="#EAEEF2"/>

  <!-- 2. 커뮤니티별 -->
  <text class="kr" x="40" y="344" font-size="15" fill="#6E7781" font-weight="700">커뮤니티별</text>
