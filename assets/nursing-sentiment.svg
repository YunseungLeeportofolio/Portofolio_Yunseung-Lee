    <rect x="554.3" y="478" width="605.7" height="40" rx="6" fill="#C9473C"/>
    <rect x="548.3" y="478" width="12" height="40" fill="#C9473C"/>
    <rect x="548.3" y="478" width="6" height="40" fill="#1C7C74"/>
    <text class="kr" x="346" y="504.12" font-size="17" fill="#FFFFFF" font-weight="800">긍정 27%</text>
    <text class="kr" x="1144" y="504.12" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 73%</text>
  </g>
  <!-- 일간베스트 -->
  <g>
    <text class="kr" x="40" y="554" font-size="16.5" fill="#1F2328" font-weight="700">일간베스트</text>
    <text class="kr" x="40" y="573" font-size="14" fill="#6E7781">142건</text>
    <rect x="330" y="536" width="216.3" height="40" rx="6" fill="#1C7C74"/>
    <rect x="546.3" y="536" width="613.7" height="40" rx="6" fill="#C9473C"/>
    <rect x="540.3" y="536" width="12" height="40" fill="#C9473C"/>
    <rect x="540.3" y="536" width="6" height="40" fill="#1C7C74"/>
    <text class="kr" x="346" y="562.12" font-size="17" fill="#FFFFFF" font-weight="800">긍정 26%</text>
    <text class="kr" x="1144" y="562.12" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 74%</text>
  </g>

  <text class="kr" x="40" y="646" font-size="13.5" fill="#6E7781">딥러닝 감성 분류 결과 · 커뮤니티 게시글 2023.03 – 05, 대한간호협회 공식 유튜브 영상 31개의 댓글</text>
</svg>
