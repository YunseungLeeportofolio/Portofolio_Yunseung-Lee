    <rect x="330" y="362" width="182.5" height="40" rx="6" fill="#1C7C74"/>
    <rect x="512.5" y="362" width="647.5" height="40" rx="6" fill="#C9473C"/>
    <rect x="506.5" y="362" width="12" height="40" fill="#C9473C"/>
    <rect x="506.5" y="362" width="6" height="40" fill="#1C7C74"/>
    <text class="kr" x="346" y="388.12" font-size="17" fill="#FFFFFF" font-weight="800">긍정 22%</text>
    <text class="kr" x="1144" y="388.12" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 78%</text>
  </g>
  <!-- 에펨코리아 -->
  <g>
    <text class="kr" x="40" y="438" font-size="16.5" fill="#1F2328" font-weight="700">에펨코리아</text>
    <text class="kr" x="40" y="457" font-size="14" fill="#6E7781">560건</text>
    <rect x="330" y="420" width="206.0" height="40" rx="6" fill="#1C7C74"/>
    <rect x="536.0" y="420" width="624.0" height="40" rx="6" fill="#C9473C"/>
    <rect x="530.0" y="420" width="12" height="40" fill="#C9473C"/>
    <rect x="530.0" y="420" width="6" height="40" fill="#1C7C74"/>
    <text class="kr" x="346" y="446.12" font-size="17" fill="#FFFFFF" font-weight="800">긍정 25%</text>
    <text class="kr" x="1144" y="446.12" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="end">부정 75%</text>
  </g>
  <!-- 뽐뿌 -->
  <g>
    <text class="kr" x="40" y="496" font-size="16.5" fill="#1F2328" font-weight="700">뽐뿌</text>
