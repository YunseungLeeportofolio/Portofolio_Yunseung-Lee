    <line x1="40" y1="400" x2="1160" y2="400" stroke="#EAEEF2"/>
    <text class="kr" x="40" y="435" font-size="17" fill="#1F2328" font-weight="700">공약 홍보</text>
    <rect x="300" y="418" width="67.8" height="22" rx="5" fill="#C9473C"/>
    <text class="en" x="377.83" y="435" font-size="15" fill="#C9473C" font-weight="700">22.6%</text>
    <rect x="518" y="418" width="41.8" height="22" rx="5" fill="#C9473C"/>
    <text class="en" x="569.76" y="435" font-size="15" fill="#C9473C" font-weight="700">348</text>
    <rect x="736" y="418" width="42.0" height="22" rx="5" fill="#C9473C"/>
