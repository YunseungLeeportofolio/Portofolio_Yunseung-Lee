  <!-- 주석 -->
  <text class="kr" x="40" y="506" font-size="14" fill="#6E7781">Kruskal-Wallis 검정 · 사후 검정에서 공약 홍보 영상만 다른 유형보다 참여가 유의하게 낮음 (댓글은 로고송과의 차이만 n.s.)</text>
