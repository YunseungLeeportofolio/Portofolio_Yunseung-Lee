<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img"
     aria-label="많이 올린 것과 많이 반응한 것이 달랐습니다. 유형별 게시 비중과 조회수·댓글 수·좋아요 수 중앙값. 대면 선거 활동 34.6%, 959, 17.0, 100. 공식 홍보 14.4%, 883, 14.5, 76. 정치인 출연 미디어 20.5%, 842, 15.0, 82.5. 로고송 뮤직비디오 8.0%, 781, 9.5, 82.5. 공약 홍보 22.6%, 348, 7.0, 25.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="539" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40" y="62" font-size="23" fill="#1F2328" font-weight="800">많이 올린 것과 많이 반응한 것이 달랐습니다</text>

  <!-- 열 제목 -->
  <text class="kr" x="300" y="124" font-size="15.5" fill="#1F2328" font-weight="700">게시 비중</text>
  <text class="kr" x="518" y="124" font-size="15.5" fill="#1F2328" font-weight="700">조회수 중앙값</text>
  <text class="en" x="518" y="142" font-size="12.5" fill="#6E7781">H = 36.71***</text>
  <text class="kr" x="736" y="124" font-size="15.5" fill="#1F2328" font-weight="700">댓글 수 중앙값</text>
  <text class="en" x="736" y="142" font-size="12.5" fill="#6E7781">H = 23.66***</text>
  <text class="kr" x="954" y="124" font-size="15.5" fill="#1F2328" font-weight="700">좋아요 수 중앙값</text>
  <text class="en" x="954" y="142" font-size="12.5" fill="#6E7781">H = 22.92***</text>

