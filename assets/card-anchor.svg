<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="부산 청년 실태보고서: 빅데이터 분석팀 팀장으로 부산 지역 일간지 기사 22,292건을 청년 통계와 비교해 「2026 부산 청년 실태보고서」를 작성. 자세히 보기"><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="260" rx="26" fill="#0E1726"/><rect width="1200" height="260" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#2AC1BC"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#2AC1BC" font-weight="700" letter-spacing="2">PROJECT 01</text><text class="kr" x="190.0" y="65.0" font-size="13.5" fill="#94A3B8">2025.09 – 2026.08  ·  부산형 앵커(ANCHOR) 사업</text><text class="kr" x="50.0" y="122.0" font-size="36" fill="#F8FAFC" font-weight="800">부산 청년 실태보고서</text><text class="kr" x="52.0" y="162.0" font-size="18" fill="#E2E8F0">언론은 청년 문제를 실제 심각성만큼 다루고 있을까?</text><text class="kr" x="52.0" y="214.0" font-size="15" fill="#2AC1BC" font-weight="700">자세히 보기 →</text><line x1="716" y1="40" x2="716" y2="220" stroke="#22324A"/><text class="mono" x="752.0" y="74.0" font-size="11" fill="#5B6B82" letter-spacing="2">ROLE</text><text class="kr" x="752.0" y="98.0" font-size="16" fill="#F8FAFC" font-weight="500">빅데이터 분석팀 팀장 · 분석 파트 총괄</text><text class="mono" x="752.0" y="132.0" font-size="11" fill="#5B6B82" letter-spacing="2">DATA</text><text class="kr" x="752.0" y="156.0" font-size="16" fill="#F8FAFC" font-weight="500">부산 지역 일간지 기사 22,292건 + 청년 통계</text><text class="mono" x="752.0" y="190.0" font-size="11" fill="#5B6B82" letter-spacing="2">OUTPUT</text><text class="kr" x="752.0" y="214.0" font-size="16" fill="#F8FAFC" font-weight="500">「2026 부산 청년 실태보고서」 · 정책 기초자료</text></svg>