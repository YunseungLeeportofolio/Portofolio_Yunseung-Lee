<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="간호법 언론·여론 분석: 대한간호협회 의뢰로 뉴스 기사와 온라인 커뮤니티 게시글을 분석하고 협회 임원진에게 결과를 발표. 자세히 보기"><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="260" rx="26" fill="#0E1726"/><rect width="1200" height="260" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#FF7A6B"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#FF7A6B" font-weight="700" letter-spacing="2">PROJECT 02</text><text class="kr" x="190.0" y="65.0" font-size="13.5" fill="#94A3B8">2023.06 – 2023.12  ·  대한간호협회 의뢰 연구</text><text class="kr" x="50.0" y="122.0" font-size="36" fill="#F8FAFC" font-weight="800">간호법 언론·여론 분석</text><text class="kr" x="52.0" y="162.0" font-size="18" fill="#E2E8F0">간호법 논쟁 속 언론과 온라인 여론은 무엇을 말했나?</text><text class="kr" x="52.0" y="214.0" font-size="15" fill="#FF7A6B" font-weight="700">자세히 보기 →</text><line x1="716" y1="40" x2="716" y2="220" stroke="#22324A"/><text class="mono" x="752.0" y="74.0" font-size="11" fill="#5B6B82" letter-spacing="2">ROLE</text><text class="kr" x="752.0" y="98.0" font-size="16" fill="#F8FAFC" font-weight="500">데이터 수집·분석 전담 (연구보조원)</text><text class="mono" x="752.0" y="132.0" font-size="11" fill="#5B6B82" letter-spacing="2">DATA</text><text class="kr" x="752.0" y="156.0" font-size="16" fill="#F8FAFC" font-weight="500">간호법 뉴스 기사 + 온라인 커뮤니티 게시글</text><text class="mono" x="752.0" y="190.0" font-size="11" fill="#5B6B82" letter-spacing="2">OUTPUT</text><text class="kr" x="752.0" y="214.0" font-size="16" fill="#F8FAFC" font-weight="500">의뢰 보고서 · 협회 임원진 대상