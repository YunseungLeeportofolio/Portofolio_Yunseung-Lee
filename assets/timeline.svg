<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img"
     aria-label="Timeline 2018–2026. 학업: 부산대학교 미디어커뮤니케이션학과 학사 2018.03–2024.02, 석사 2024.03–2026.08. 현장: 서던포스트 현장 설문조사원 2018.06–11, 영남체육신문 축구부 기자 2021.10–2024.01. 연구: 한국연구재단 SSK 연구원(디지털정치표현랩) 2023.08–2026.09, 간호법 언론·여론 분석(대한간호협회 의뢰) 2023.06–12, 차별 보도 법제 비교(언론중재위원회 의뢰) 2024.04–11, 부산 청년 실태보고서(앵커 사업 분석팀 팀장) 2025.09–2026.08.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="447" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

