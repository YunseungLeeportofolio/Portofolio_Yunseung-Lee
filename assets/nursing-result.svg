<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img"
     aria-label="보도의 중심은 간호사에서 정치 갈등으로 옮겨 갔습니다. YTN 보도에서 대통령 거부권 68건, 간호사 응원·감사 4건. 긍정 감성 점수는 대한간호협회 유튜브 댓글 0.7, 온라인 커뮤니티 4곳 0.3. 진단: 법에 대한 반감이 아니라 쟁점의 정치화와 오해.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="479" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40" y="62" font-size="23" fill="#1F2328" font-weight="800">보도의 중심은 간호사에서 정치 갈등으로 옮겨 갔습니다</text>

  <!-- 패널 1: YTN 의제별 보도 건수 -->
  <g>
    <rect x="40" y="92" width="548" height="262" rx="18" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="kr" x="68" y="132" font-size="14" fill="#6E7781" font-weight="600">YTN 의제별 보도 건수</text>
    <text class="kr" x="68" y="184" font-size="16.5" fill="#1F2328" font-weight="700">대통령 거부권</text>
    <rect x="68" y="198" width="400.0" height="30" rx="6" fill="#C9473C"/>
    <text class="en" x="480" y="221" font-size="21" fill="#C9473C" font-weight="800">68건</text>
    <text class="kr" x="68" y="272" font-size="16.5" fill="#1F2328" font-weight="700">간호사 응원 · 감사</text>
    <rect x="68" y="286" width="23.5" height="30" rx="6" fill="#1C7C74"/>
    <text class="en" x="103.529" y="309" font-size="21" fill="#1C7C74" font-weight="800">4건</text>
  </g>
  <!-- 패널 2: 긍정 감성 점수 (0 – 1, 1에 가까울수록 긍정) -->
  <g>
    <rect x="612" y="92" width="548" height="262" rx="18" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="kr" x="640" y="132" font-size="14" fill="#6E7781" font-weight="600">긍정 감성 점수 (0 – 1, 1에 가까울수록 긍정)</text>
    <text class="kr" x="640" y="184" font-size="16.5" fill="#1F2328" font-weight="700">대한간호협회 유튜브 댓글</text>
    <rect x="640" y="198" width="280.0" height="30" rx="6" fill="#3563C9"/>
    <text class="en" x="932" y="221" font-size="21" fill="#3563C9" font-weight="800">0.7</text>
    <text class="kr" x="640" y="272" font-size="16.5" fill="#1F2328" font-weight="700">온라인 커뮤니티 4곳</text>
    <rect x="640" y="286" width="120.0" height="30" rx="6" fill="#C9473C"/>
    <text class="en" x="772" y="309" font-size="21" fill="#C9473C" font-weight="800">0.3</text>
  </g>

  <!-- 진단 -->
  <text class="kr" x="40" y="418" font-size="15.5" fill="#424A53"><tspan font-weight="700" fill="#C9473C">진단</tspan>  법에 대한 반감이 아니라 쟁점의 정치화와 오해였습니다. ‘지역사회’ 문구 논란 같은 쟁점이</text>
  <text class="kr" x="40" y="446" font-size="15.5" fill="#424A53">사실 확인 없이 조롱 · 비난과 함께 커뮤니티에서 퍼지고 있었습니다.</text>
</svg>
