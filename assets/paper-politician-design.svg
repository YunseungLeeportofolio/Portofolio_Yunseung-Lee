<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="연구 설계: 부산 총선 후보 35명의 유튜브 영상 376건 수집(2024.02.26–04.10), 12개 유목 휴먼 코딩(Cohen κ=.88), 유목별 시간을 속성으로 K-평균 군집화(엘보우 9개), 연구진 검토 후 5개 유형: 대면 선거 활동, 공약 홍보, 정치인 출연 미디어, 공식 홍보, 로고송 뮤직비디오."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="400" rx="26" fill="#0E1726"/><rect width="1200" height="400" rx="26" fill="url(#g)"/><defs><marker id="hm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2AC1BC"/></marker><marker id="hc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF7A6B"/></marker><marker id="ha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F5B841"/></marker><marker id="hb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FA8FF"/></marker><marker id="hd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6B82"/></marker><marker id="hg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">RESEARCH DESIGN</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">영상을 직접 보고 분류한 뒤, 통계로 유형을 다시 검증했습니다</text><rect x="48" y="120" width="248" height="130" rx="14" fill="#142034"/><text class="mono" x="70.0" y="152.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">01  COLLECT</text><text class="kr" x="70.0" y="186.0" font-size="20" fill="#F8FAFC" font-weight="800">영상 수집</text><text class="kr" x="70.0" y="214.0" font-size="14.5" fill="#E2E8F0">후보 35명 · 376건</text><text class="kr" x="70.0" y="236.0" font-size="13.5" fill="#94A3B8">2024.02.26 – 04.10</text><line x1="302.0" y1="185.0" x2="326.0" y2="185.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="332" y="120" width="248" height="130" rx="14" fill="#142034"/><text class="mono" x="354.0" y="152.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">02  CODE</text><text class="kr" x="354.0" y="186.0" font-size="20" fill="#F8FAFC" font-weight="800">휴먼 코딩</text><text class="kr" x="354.0" y="214.0" font-size="14.5" fill="#E2E8F0">12개 유목 귀납 도출</text><text class="en" x="354.0" y="236.0" font-size="13.5" fill="#94A3B8">Cohen’s κ = .88</text><line x1="586.0" y1="185.0" x2="610.0" y2="185.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="616" y="120" width="248" height="130" rx="14" fill="#142034"/><text class="mono" x="638.0" y="152.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">03  CLUSTER</text><text class="kr" x="638.0" y="186.0" font-size="20" fill="#F8FAFC" font-weight="800">K-평균 군집화</text><text class="kr" x="638.0" y="214.0" font-size="14.5" fill="#E2E8F0">유목별 시간(초)을 속성으로</text><text class="en" x="638.0" y="236.0" font-size="13.5" fill="#94A3B8">엘보우 기법 9개</text><line x1="870.0" y1="185.0" x2="894.0" y2="185.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#hg)"/><rect x="900" y="120" width="248" height="130" rx="14" fill="#142034"/><text class="mono" x="922.0" y="152.0" font-size="11" fill="#FF7A6B" font-weight="700" letter-spacing="1.5">04  REVIEW</text><text class="kr" x="922.0" y="186.0" font-size="20" fill="#F8FAFC" font-weight="800">연구진 검토</text><text class="kr" x="922.0" y="214.0" font-size="14.5" fill="#E2E8F0">맥락에 맞는지 재확인</text><text class="en" x="922.0" y="236.0" font-size="13.5" fill="#94A3B8">최종 5개 유형</text><text class="kr" x="48.0" y="306.0" font-size="12" fill="#5B6B82">5개 소구 유형</text><rect x="48" y="325" width="117" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="62.0" y="342.5" font-size="14" fill="#FF7A6B" font-weight="700">대면 선거 활동</text><rect x="176.5388" y="325" width="86" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="190.5" y="342.5" font-size="14" fill="#FF7A6B" font-weight="700">공약 홍보</text><rect x="274.2188" y="325" width="143" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="288.2" y="342.5" font-size="14" fill="#FF7A6B" font-weight="700">정치인 출연 미디어</text><rect x="429.5788" y="325" width="86" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="443.6" y="342.5" font-size="14" fill="#FF7A6B" font-weight="700">공식 홍보</text><rect x="527.2588000000001" y="325" width="139" height="26" rx="13" fill="#FF7A6B" fill-opacity=".14"/><text class="kr" x="541.3" y="342.5" font-size="14" fill="#FF7A6B" font-weight="700">로고송 뮤직비디오</text></svg>