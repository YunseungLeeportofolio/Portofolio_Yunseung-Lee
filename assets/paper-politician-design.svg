<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="휴먼 코딩과 군집화 분석 동시 수행: 콘텐츠 수집, 휴먼 코딩(귀납적 소구 유형 12개), K-평균 군집화(유목별 시간 기준), 검토. 5개 소구 유형: 대면 선거 활동, 공약 홍보, 정치인 출연 미디어, 공식 홍보, 로고송 뮤직비디오.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;letter-spacing:1.5px}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40" y="62" font-size="23" fill="#1F2328" font-weight="800">휴먼 코딩과 군집화 분석 동시 수행</text>

  <!-- 단계 1: 콘텐츠 수집 -->
  <g>
    <rect x="40" y="96" width="247" height="186" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="64" y="134" font-size="12.5" fill="#C9473C" font-weight="700">01 COLLECT</text>
    <text class="kr" x="64" y="172" font-size="21" fill="#1F2328" font-weight="800">콘텐츠 수집</text>
    <text class="kr" x="64" y="206" font-size="15.5" fill="#424A53">후보 35명의 유튜브 영상</text>
    <text class="kr" x="64" y="230" font-size="15.5" fill="#424A53">376건</text>
    <text class="kr" x="64" y="262" font-size="14" fill="#6E7781">2024.02.26 – 04.10</text>
  </g>
  <!-- 화살표 -->
  <line x1="297" y1="189" x2="315" y2="189" stroke="#6E7781" stroke-width="2"/>
  <path d="M313 183 L321 189 L313 195" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 단계 2: 휴먼 코딩 -->
  <g>
    <rect x="331" y="96" width="247" height="186" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="355" y="134" font-size="12.5" fill="#C9473C" font-weight="700">02 CODE</text>
    <text class="kr" x="355" y="172" font-size="21" fill="#1F2328" font-weight="800">휴먼 코딩</text>
    <text class="kr" x="355" y="206" font-size="15.5" fill="#424A53">귀납적 콘텐츠 소구 유형</text>
    <text class="kr" x="355" y="230" font-size="15.5" fill="#424A53">12개 분류</text>
    <text class="kr" x="355" y="262" font-size="14" fill="#6E7781">Cohen’s κ = .88</text>
  </g>
  <!-- 화살표 -->
  <line x1="588" y1="189" x2="606" y2="189" stroke="#6E7781" stroke-width="2"/>
  <path d="M604 183 L612 189 L604 195" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 단계 3: K-평균 군집화 -->
  <g>
    <rect x="622" y="96" width="247" height="186" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="646" y="134" font-size="12.5" fill="#C9473C" font-weight="700">03 CLUSTER</text>
    <text class="kr" x="646" y="172" font-size="21" fill="#1F2328" font-weight="800">K-평균 군집화</text>
    <text class="kr" x="646" y="206" font-size="15.5" fill="#424A53">각 유목별 시간을 기준으로</text>
    <text class="kr" x="646" y="230" font-size="15.5" fill="#424A53">유형 군집화</text>
    <text class="kr" x="646" y="262" font-size="14" fill="#6E7781">엘보우 기법 9개</text>
  </g>
  <!-- 화살표 -->
  <line x1="879" y1="189" x2="897" y2="189" stroke="#6E7781" stroke-width="2"/>
  <path d="M895 183 L903 189 L895 195" fill="none" stroke="#6E7781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 단계 4: 검토 -->
  <g>
    <rect x="913" y="96" width="247" height="186" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
    <text class="mono" x="937" y="134" font-size="12.5" fill="#C9473C" font-weight="700">04 REVIEW</text>
    <text class="kr" x="937" y="172" font-size="21" fill="#1F2328" font-weight="800">검토</text>
    <text class="kr" x="937" y="206" font-size="15.5" fill="#424A53">분류된 유형이 적합한지</text>
    <text class="kr" x="937" y="230" font-size="15.5" fill="#424A53">재확인</text>
    <text class="kr" x="937" y="262" font-size="14" fill="#6E7781">최종 5개 유형</text>
  </g>

  <!-- 5개 소구 유형 -->
  <text class="kr" x="40" y="322" font-size="14" fill="#6E7781" font-weight="600">5개 소구 유형</text>
  <rect x="40" y="336" width="127" height="32" rx="16" fill="#FBE9E7"/>
  <text class="kr" x="56" y="357.5" font-size="15" fill="#C9473C" font-weight="700">대면 선거 활동</text>
  <rect x="178.863" y="336" width="94" height="32" rx="16" fill="#FBE9E7"/>
  <text class="kr" x="194.863" y="357.5" font-size="15" fill="#C9473C" font-weight="700">공약 홍보</text>
  <rect x="284.663" y="336" width="156" height="32" rx="16" fill="#FBE9E7"/>
  <text class="kr" x="300.663" y="357.5" font-size="15" fill="#C9473C" font-weight="700">정치인 출연 미디어</text>
  <rect x="452.263" y="336" width="94" height="32" rx="16" fill="#FBE9E7"/>
  <text class="kr" x="468.263" y="357.5" font-size="15" fill="#C9473C" font-weight="700">공식 홍보</text>
  <rect x="558.063" y="336" width="151" height="32" rx="16" fill="#FBE9E7"/>
  <text class="kr" x="574.063" y="357.5" font-size="15" fill="#C9473C" font-weight="700">로고송 뮤직비디오</text>
</svg>
