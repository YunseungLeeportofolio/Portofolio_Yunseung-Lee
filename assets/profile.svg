<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="이윤승 Yunseung Lee, 여론 해석가(Public Opinion Interpreter). 부산대학교 미디어커뮤니케이션학 석사(2026.08)·학사(2024.02). 부산형 앵커 사업 분석팀 팀장, 한국연구재단 SSK 연구원. 학술지 논문 7편(SSCI 5·KCI 2), 컨퍼런스 발표 10회(국제 컨퍼런스 4회), 한국언론학회 논문상 2회, 기관 의뢰 및 지역 사업 3건.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif} .mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style>


  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 이름 -->
  <text class="en" x="60" y="90" font-size="14" fill="#1C7C74" font-weight="700" letter-spacing="4">PUBLIC OPINION INTERPRETER</text>
  <text class="kr" x="57" y="168" font-size="66" fill="#1F2328" font-weight="800">이윤승</text>
  <text class="en" x="60" y="208" font-size="22" fill="#6E7781" letter-spacing="1">Yunseung Lee</text>
  <rect x="60" y="230" width="44" height="3" rx="1.5" fill="#1C7C74"/>

  <!-- 학력 -->
  <text class="mono" x="60" y="278" font-size="11" fill="#8C959F" letter-spacing="2">EDUCATION</text>
  <text class="kr" x="60" y="306" font-size="16.5" fill="#1F2328" font-weight="700">부산대학교 미디어커뮤니케이션학 석사</text>
  <text class="en" x="390" y="306" font-size="14.5" fill="#6E7781">2026.08</text>
  <text class="kr" x="60" y="334" font-size="16.5" fill="#424A53">부산대학교 미디어커뮤니케이션학 학사</text>
  <text class="en" x="390" y="334" font-size="14.5" fill="#6E7781">2024.02</text>

  <!-- 경력 -->
  <text class="mono" x="60" y="384" font-size="11" fill="#8C959F" letter-spacing="2">EXPERIENCE</text>
  <text class="kr" x="60" y="412" font-size="15.5" fill="#424A53">부산형 앵커 사업 분석팀 팀장</text>
  <text class="kr" x="60" y="438" font-size="15.5" fill="#424A53">한국연구재단 SSK 연구원</text>

  <!-- 구분선 -->
  <line x1="560" y1="48" x2="560" y2="422" stroke="#D8DEE4"/>

  <!-- 숫자 타일 4개: 숫자 · 제목 · 설명만 바꾸면 됩니다 -->
  <rect x="596" y="48" width="270" height="179" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
  <text class="en" x="622" y="122" font-size="50" fill="#1C7C74" font-weight="800">7</text>
  <text class="kr" x="622" y="164" font-size="17" fill="#1F2328" font-weight="700">학술지 논문</text>
  <text class="kr" x="622" y="190" font-size="14" fill="#6E7781">SSCI 5 · KCI 2</text>
  <rect x="882" y="48" width="270" height="179" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
  <text class="en" x="908" y="122" font-size="50" fill="#1C7C74" font-weight="800">10</text>
  <text class="kr" x="908" y="164" font-size="17" fill="#1F2328" font-weight="700">컨퍼런스 발표</text>
  <text class="kr" x="908" y="190" font-size="14" fill="#6E7781">ICA · AEJMC 등 국제 컨퍼런스 4회</text>
  <rect x="596" y="243" width="270" height="179" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
  <text class="en" x="622" y="317" font-size="50" fill="#1C7C74" font-weight="800">2</text>
  <text class="kr" x="622" y="359" font-size="17" fill="#1F2328" font-weight="700">한국언론학회 논문상</text>
  <text class="kr" x="622" y="385" font-size="14" fill="#6E7781">최우수상 · 우수상</text>
  <rect x="882" y="243" width="270" height="179" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
  <text class="en" x="908" y="317" font-size="50" fill="#1C7C74" font-weight="800">3</text>
  <text class="kr" x="908" y="359" font-size="17" fill="#1F2328" font-weight="700">기관 의뢰 및 지역 사업</text>
</svg>
