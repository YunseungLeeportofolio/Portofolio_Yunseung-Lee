  <text class="kr" x="898.0" y="145.0" font-size="13.5" fill="#424A53">국제신문</text>
  <g>
    <text class="kr" x="790.0" y="186.0" font-size="15" fill="#1F2328" font-weight="700">인구 유출 · 지역 소멸</text>
    <rect x="790" y="198" width="84.4" height="20" rx="5" fill="#3563C9"/>
    <text class="en" x="882.4" y="214.0" font-size="14" fill="#3563C9" font-weight="800">2.5%</text>
    <rect x="790" y="226" width="262.4" height="20" rx="5" fill="#B4691F"/>
    <text class="en" x="1060.4" y="242.0" font-size="14" fill="#B4691F" font-weight="800">7.9%</text>
    <text class="kr" x="790.0" y="278.0" font-size="15" fill="#1F2328" font-weight="700">대출 · 주거 비용</text>
    <rect x="790" y="290" width="110.4" height="20" rx="5" fill="#3563C9"/>
    <text class="en" x="908.4" y="306.0" font-size="14" fill="#3563C9" font-weight="800">3.3%</text>
    <rect x="790" y="318" width="125.2" height="20" rx="5" fill="#B4691F"/>
    <text class="en" x="923.2" y="334.0" font-size="14" fill="#B4691F" font-weight="800">3.8%</text>
    <text class="kr" x="790.0" y="370.0" font-size="15" fill="#1F2328" font-weight="700">건강 · 저출산</text>
    <rect x="790" y="382" width="30.8" height="20" rx="5" fill="#3563C9"/>
    <text class="en" x="828.8" y="398.0" font-size="14" fill="#3563C9" font-weight="800">0.9%</text>
    <rect x="790" y="410" width="98.1" height="20" rx="5" fill="#B4691F"/>
    <text class="en" x="896.1" y="426.0" font-size="14" fill="#B4691F" font-weight="800">2.9%</text>
  </g>
  <text class="kr" x="790.0" y="464.0" font-size="13.5" fill="#424A53">국제신문은 인구 유출을 부산일보의 약 3배 비중으로 다뤘습니다</text>

  <!-- 출처 -->
  <text class="kr" x="40.0" y="530.0" font-size="13.5" fill="#6E7781">부산일보 · 국제신문 청년 일반 기사 20,000건 (2022.03 – 2026.04), BERTopic 의제 분류 · 출처: 빅카인즈</text>
</svg>
