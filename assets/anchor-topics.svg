    <text class="en" x="677.9" y="138.0" font-size="16" fill="#1C7C74" font-weight="800">35.8%</text>
    <text class="kr" x="40.0" y="183.0" font-size="16" fill="#424A53">범죄 · 사건 사고</text>
    <rect x="250" y="166" width="125.1" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="385.1" y="184.0" font-size="16" fill="#6E7781" font-weight="800">10.7%</text>
    <text class="kr" x="40.0" y="229.0" font-size="16" fill="#1F2328" font-weight="700">인구 유출 · 지역 소멸</text>
    <rect x="250" y="212" width="40.7" height="24" rx="5" fill="#C9473C"/>
    <text class="en" x="300.7" y="230.0" font-size="16" fill="#C9473C" font-weight="800">3.5%</text>
    <text class="kr" x="40.0" y="275.0" font-size="16" fill="#1F2328" font-weight="700">대출 · 주거 비용</text>
    <rect x="250" y="258" width="39.5" height="24" rx="5" fill="#C9473C"/>
    <text class="en" x="299.6" y="276.0" font-size="16" fill="#C9473C" font-weight="800">3.4%</text>
    <text class="kr" x="40.0" y="321.0" font-size="16" fill="#1F2328" font-weight="700">건강 · 저출산</text>
    <rect x="250" y="304" width="15.0" height="24" rx="5" fill="#C9473C"/>
    <text class="en" x="275.0" y="322.0" font-size="16" fill="#C9473C" font-weight="800">1.3%</text>
    <text class="kr" x="40.0" y="367.0" font-size="16" fill="#424A53">탄소중립 일자리</text>
    <rect x="250" y="350" width="8.9" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="268.9" y="368.0" font-size="16" fill="#6E7781" font-weight="800">0.8%</text>
    <text class="kr" x="40.0" y="413.0" font-size="16" fill="#424A53">젠더 갈등</text>
    <rect x="250" y="396" width="3.0" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="263.0" y="414.0" font-size="16" fill="#6E7781" font-weight="800">0.3%</text>
    <text class="kr" x="40.0" y="459.0" font-size="16" fill="#424A53">대기업 공채</text>
    <rect x="250" y="442" width="3.0" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="263.0" y="460.0" font-size="16" fill="#6E7781" font-weight="800">0.2%</text>
    <text class="kr" x="40.0" y="502.0" font-size="13.5" fill="#6E7781">어느 의제에도 묶이지 않은 기사(미분류) 43.8% 포함 기준</text>
  </g>

  <!-- 언론사별로 나누면 -->
  <rect x="766" y="84" width="394" height="406" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
  <text class="kr" x="790.0" y="118.0" font-size="17" fill="#1F2328" font-weight="800">언론사별로 나누면</text>
  <rect x="790" y="134" width="12" height="12" rx="3" fill="#3563C9"/>
  <text class="kr" x="808.0" y="145.0" font-size="13.5" fill="#424A53">부산일보</text>
