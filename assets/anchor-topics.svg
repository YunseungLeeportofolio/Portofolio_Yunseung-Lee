<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-label="부산일보·국제신문 청년 기사 2만 건의 BERTopic 의제 비중: 고용 · 창업 지원 35.8%, 범죄 · 사건 사고 10.7%, 인구 유출 · 지역 소멸 3.5%, 대출 · 주거 비용 3.4%, 건강 · 저출산 1.3%, 탄소중립 일자리 0.8%, 젠더 갈등 0.3%, 대기업 공채 0.2%. 미분류 43.8%.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="559" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40.0" y="62.0" font-size="23" fill="#1F2328" font-weight="800">보도는 고용 · 창업에 몰렸고, 유출 · 주거 · 건강은 주변에 머물렀습니다</text>

  <!-- 의제별 보도 비중 -->
  <g>
    <text class="kr" x="40.0" y="98.0" font-size="14" fill="#6E7781" font-weight="600">전체 기사 중 비중 (n = 20,000)</text>
    <text class="kr" x="40.0" y="137.0" font-size="16" fill="#1F2328" font-weight="700">고용 · 창업 지원</text>
