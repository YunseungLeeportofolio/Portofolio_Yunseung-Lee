<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img"
     aria-label="유학생 기사 의제 비중: 대학 국제 협력 · 유치 56.0%, 지방대 위기의 대안 4.1%, 범죄 · 방역 위반 4.1%, 대학 평가 · AI 2.7%, 국제노선 · 외국인 유치 1.4%. 유학생을 고용해 본 부울경 기업 5.5%, 미고용 이유 1위 고용 기회 없음 50.6%.">
  <style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif} .en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}</style>

  <!-- 배경 -->
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="#FFFFFF" stroke="#D8DEE4"/>

  <!-- 제목 -->
  <text class="kr" x="40.0" y="62.0" font-size="23" fill="#1F2328" font-weight="800">언론은 유학생을 대학의 성과로 다뤘지만, 지역 기업의 문은 거의 닫혀 있었습니다</text>

  <!-- 유학생 보도 의제 -->
  <g>
    <text class="kr" x="40.0" y="98.0" font-size="14" fill="#6E7781" font-weight="600">유학생 기사 의제 비중 (n = 2,391)</text>
    <text class="kr" x="40.0" y="137.0" font-size="16" fill="#1F2328" font-weight="700">대학 국제 협력 · 유치</text>
    <rect x="260" y="120" width="299.8" height="24" rx="5" fill="#1C7C74"/>
    <text class="en" x="569.8" y="138.0" font-size="16" fill="#1C7C74" font-weight="800">56.0%</text>
    <text class="kr" x="40.0" y="183.0" font-size="16" fill="#1F2328" font-weight="700">지방대 위기의 대안</text>
    <rect x="260" y="166" width="22.0" height="24" rx="5" fill="#C9473C"/>
    <text class="en" x="292.0" y="184.0" font-size="16" fill="#C9473C" font-weight="800">4.1%</text>
    <text class="kr" x="40.0" y="229.0" font-size="16" fill="#424A53">범죄 · 방역 위반</text>
    <rect x="260" y="212" width="21.7" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="291.7" y="230.0" font-size="16" fill="#6E7781" font-weight="800">4.1%</text>
    <text class="kr" x="40.0" y="275.0" font-size="16" fill="#424A53">대학 평가 · AI</text>
    <rect x="260" y="258" width="14.3" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="284.3" y="276.0" font-size="16" fill="#6E7781" font-weight="800">2.7%</text>
    <text class="kr" x="40.0" y="321.0" font-size="16" fill="#424A53">국제노선 · 외국인 유치</text>
    <rect x="260" y="304" width="7.6" height="24" rx="5" fill="#AEB9C7"/>
    <text class="en" x="277.6" y="322.0" font-size="16" fill="#6E7781" font-weight="800">1.4%</text>
    <text class="kr" x="40.0" y="364.0" font-size="13.5" fill="#6E7781">미분류 30.8% 포함 기준 · 2021.04 – 2026.04</text>
  </g>

  <!-- 기업 조사 -->
  <g>
    <rect x="700" y="88" width="460" height="312" rx="16" fill="#FBE9E7"/>
    <text class="kr" x="726.0" y="124.0" font-size="14" fill="#6E7781" font-weight="600">부산 · 울산 · 경남 기업 조사 (2025)</text>
    <text class="en" x="726.0" y="190.0" font-size="54" fill="#C9473C" font-weight="800">5.5%</text>
    <text class="kr" x="726.0" y="222.0" font-size="17" fill="#1F2328" font-weight="800">유학생을 고용해 본 기업</text>
    <rect x="726" y="240" width="408" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="726" y="240" width="22.4" height="14" rx="7" fill="#C9473C"/>
    <text class="kr" x="726.0" y="300.0" font-size="15" fill="#424A53">고용하지 않은 이유 1위  ‘고용 기회 자체가 없었다’ 50.6%</text>
    <text class="kr" x="726.0" y="330.0" font-size="15" fill="#424A53">유학생을 적극 선호한다는 기업  12.3%</text>
    <text class="kr" x="726.0" y="370.0" font-size="14.5" fill="#C9473C" font-weight="700">한국어보다 고용 기회 부재가 더 큰 벽이었습니다</text>
  </g>

  <!-- 출처 -->
  <text class="kr" x="40.0" y="440.0" font-size="13.5" fill="#6E7781">부산일보 · 국제신문 유학생 기사 2,391건 BERTopic 의제 분류(빅카인즈) · 기업 인식: KOSIS</text>
</svg>
