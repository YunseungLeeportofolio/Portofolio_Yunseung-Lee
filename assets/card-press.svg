<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="차별적 언론 보도 법제 비교: 언론중재위원회 의뢰로 한국·영국·독일·일본·EU를 비교하는 다국적 연구팀을 구성·조율하고 보고서 발간. 자세히 보기"><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="260" rx="26" fill="#0E1726"/><rect width="1200" height="260" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#F5B841"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#F5B841" font-weight="700" letter-spacing="2">PROJECT 03</text><text class="kr" x="190.0" y="65.0" font-size="13.5" fill="#94A3B8">2024.04 – 2024.11  ·  언론중재위원회 의뢰 연구</text><text class="kr" x="50.0" y="122.0" font-size="36" fill="#F8FAFC" font-weight="800">차별적 언론 보도 법제 비교</text><text class="kr" x="52.0" y="162.0" font-size="18" fill="#E2E8F0">각국은 차별적 언론 보도를 어떻게 규율하고 바로잡는가?</text><text class="kr" x="52.0" y="214.0" font-size="15" fill="#F5B841" font-weight="700">자세히 보기 →</text><line x1="716" y1="40" x2="716" y2="220" stroke="#22324A"/><text class="mono" x="752.0" y="74.0" font-size="11" fill="#5B6B82" letter-spacing="2">ROLE</text><text class="kr" x="752.0" y="98.0" font-size="16" fill="#F8FAFC" font-weight="500">다국적 연구팀 구성·조율 (연구보조원)</text><text class="mono" x="752.0" y="132.0" font-size="11" fill="#5B6B82" letter-spacing="2">SCOPE</text><text class="kr" x="752.0" y="156.0" font-size="16" fill="#F8FAFC" font-weight="500">한국 · 영국 · 독일 · 일본 · EU 법제와 시정 사례</text><text class="mono" x="752.0" y="190.0" font-size="11" fill="#5B6B82" letter-spacing="2">OUTPUT</text><text class="kr" x="752.0" y="214.0" font-size="16" fill="#F8FAFC" font-weight="500">「2024 해외언론법제연구 결과보고서」 발간</text></svg>