<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="청년 전체로 보면 8년간 청년 인구 18.3% 감소, 이사 이유 1위 더 나은 일자리 51.5%. 연령대로 나누면 18–24세 대학 입학기는 순유입, 25–29세 사회 진출기는 순유출 최대(약 5,000명)."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="400" rx="26" fill="#0E1726"/><rect width="1200" height="400" rx="26" fill="url(#g)"/><text class="mono" x="48.0" y="56.0" font-size="12" fill="#5B6B82" letter-spacing="2.5">FINDING 1 · DISAGGREGATE</text><text class="kr" x="48.0" y="88.0" font-size="19" fill="#F8FAFC" font-weight="700">청년을 하나로 묶지 않고 연령대로 나누자, 떠나는 시점이 보였습니다</text><rect x="48" y="132" width="470" height="196" rx="16" fill="#142034"/><text class="kr" x="74.0" y="170.0" font-size="13.5" fill="#94A3B8">하나로 보면 · 청년 만 18–39세</text><text class="en" x="74.0" y="232.0" font-size="50" fill="#FF7A6B" font-weight="800">−18.3%</text><text class="kr" x="74.0" y="268.0" font-size="16" fill="#F8FAFC" font-weight="700">8년간 줄어든 부산 청년 인구</text><text class="kr" x="74.0" y="298.0" font-size="14.5" fill="#E2E8F0">이사 이유 1위는 ‘더 나은 일자리’ (51.5%)</text><path d="M536 218 l22 12 l-22 12z" fill="#94A3B8"/><rect x="580" y="132" width="572" height="92" rx="14" fill="#2AC1BC" fill-opacity=".12"/><rect x="580" y="132" width="6" height="92" rx="3" fill="#2AC1BC"/><text class="en" x="608.0" y="172.0" font-size="24" fill="#F8FAFC" font-weight="800">18–24세</text><text class="kr" x="608.0" y="202.0" font-size="14" fill="#94A3B8">대학 입학기</text><text class="kr" x="780.0" y="174.0" font-size="22" fill="#2AC1BC" font-weight="800">순유입</text><text class="kr" x="780.0" y="202.0" font-size="14.5" fill="#E2E8F0">대학 진학으로 부산에 들어오는 시기</text><rect x="580" y="236" width="572" height="92" rx="14" fill="#FF7A6B" fill-opacity=".12"/><rect x="580" y="236" width="6" height="92" rx="3" fill="#FF7A6B"/><text class="en" x="608.0" y="276.0" font-size="24" fill="#F8FAFC" font-weight="800">25–29세</text><text class="kr" x="608.0" y="306.0" font-size="14" fill="#94A3B8">사회 진출기</text><text class="kr" x="780.0" y="278.0" font-size="22" fill="#FF7A6B" font-weight="800">순유출 최대</text><text class="kr" x="780.0" y="306.0" font-size="14.5" fill="#E2E8F0">약 5,000명이 빠져나가는 구간</text><text class="kr" x="48.0" y="366.0" font-size="14" fill="#94A3B8">보고서는 청년을 만 18–39세로 정의합니다. 평균 하나로는 진학과 취업이라는 서로 다른 이동이 서로를 가립니다.</text></svg>