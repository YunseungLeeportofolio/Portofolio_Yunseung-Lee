<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="부산 청년 실태보고서. 빅데이터 분석팀 팀장. 5년간 부산일보·국제신문 청년·유학생 기사 22,292건을 청년 통계와 대조. 인구 유출·주거 비용 의제의 보도 비중은 3–4%, 청년 이사 이유 1위는 더 나은 일자리 51.5%."><style>.kr{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}.en{font-family:'Helvetica Neue','SF Pro Display','Segoe UI',Arial,sans-serif}.mono{font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern></defs><rect width="1200" height="320" rx="26" fill="#0E1726"/><rect width="1200" height="320" rx="26" fill="url(#g)"/><circle cx="58" cy="60" r="5" fill="#2AC1BC"/><text class="mono" x="72.0" y="65.0" font-size="12" fill="#2AC1BC" font-weight="700" letter-spacing="2">FEATURED 01</text><text class="kr" x="206.0" y="65.0" font-size="13.5" fill="#94A3B8">2025.09 – 2026.08  ·  부산형 앵커(ANCHOR) 사업  ·  빅데이터 분석팀 팀장</text><text class="kr" x="50.0" y="132.0" font-size="36" fill="#F8FAFC" font-weight="800">부산 청년 실태보고서</text><text class="kr" x="52.0" y="176.0" font-size="18" fill="#E2E8F0">통계 속 청년과 보도 속 청년은 같은 문제를 겪고 있을까?</text><rect x="52" y="245" width="93" height="26" rx="13" fill="#2AC1BC" fill-opacity=".14"/><text class="kr" x="64.0" y="262.5" font-size="13" fill="#2AC1BC" font-weight="700">Integrate</text><rect x="154.8246" y="245" width="89" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="166.8" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">BERTopic</text><rect x="254.1678" y="245" width="130" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="266.2" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">감성 · 시계열 분석</text><rect x="394.0827" y="245" width="97" height="26" rx="13" fill="#94A3B8" fill-opacity=".14"/><text class="kr" x="406.1" y="262.5" font-size="13" fill="#94A3B8" font-weight="700">KOSIS 통계</text><line x1="716" y1="40" x2="716" y2="280" stroke="#22324A"/><text class="en" x="752.0" y="92.0" font-size="30" fill="#2AC1BC" font-weight="800">22,292건</text><text class="kr" x="752.0" y="120.0" font-size="15.5" fill="#94A3B8">5년간 부산일보 · 국제신문의 청년 · 유학생 기사</text><text class="en" x="752.0" y="174.0" font-size="30" fill="#2AC1BC" font-weight="800">3–4%</text><text class="kr" x="752.0" y="202.0" font-size="15.5" fill="#94A3B8">인구 유출 · 주거 비용 의제가 보도에서 차지한 비중</text><text class="en" x="752.0" y="256.0" font-size="30" fill="#2AC1BC" font-weight="800">51.5%</text><text class="kr" x="752.0" y="284.0" font-size="15.5" fill="#94A3B8">부산 청년의 이사 이유 1위, ‘더 나은 일자리’</text></svg>